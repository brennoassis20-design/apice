<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0F">
<title>Ápice · App do Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0D0F; --s1:#141519; --s2:#1B1D22; --s3:#24272D; --line:#2C2F36;
  --bone:#EDE8DF; --mute:#9A958C; --dim:#6B675F;
  --red:#E5484D; --red2:#F08A8D; --redbg:rgba(229,72,77,.12);
  --base:#8FBFA9; --forte:#8AA6D6; --palco:#D4B074;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}

.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 110px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:66px;border-radius:24px;background:rgba(27,29,34,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:4}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--dim);width:72px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--bone)}
.tabbar button.on svg{color:var(--red)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}
.hd h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hd p{font-size:13px;color:var(--mute)}
.av{width:42px;height:42px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;border:1px solid var(--line)}
.back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin:4px 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{font-size:11px;color:var(--mute);display:block}
.kpi b{font-size:24px;font-weight:800;display:block;margin-top:6px;letter-spacing:-.02em}
.kpi span{font-size:11px;color:var(--base)}
.kpi span.neg{color:var(--red2)}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between}
.lbl a{letter-spacing:0;text-transform:none;color:var(--mute);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:12px;color:var(--mute)}
.chev{color:var(--dim)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em;white-space:nowrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-size:13px;line-height:1.4;cursor:pointer}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert small{color:var(--mute);display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;background:var(--red);color:#fff;font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:var(--s2);color:var(--bone);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.chips button.on{background:var(--bone);color:var(--bg);border-color:var(--bone)}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;margin-bottom:12px;color:var(--mute)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--bone);font-size:14px}
.bar{height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px}
.hero{border-radius:22px;padding:20px;position:relative;overflow:hidden;margin-bottom:12px;cursor:pointer;border:1px solid var(--line)}
.hero h4{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5;max-width:80%}
.hero .meta{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--bone);font-weight:600}
.hero .step{position:absolute;right:16px;top:16px;font-size:11px;font-weight:700;color:var(--mute)}
.stage{background:radial-gradient(120% 90% at 50% 0%,#1E2026 0%,#111215 70%);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%}
.stage .ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.stage .ctl button{height:30px;padding:0 12px;border-radius:99px;background:rgba(36,39,45,.9);border:1px solid var(--line);font-size:12px;font-weight:700}
.stage .ctl button.on{background:var(--bone);color:var(--bg)}
.stage .lg{position:absolute;left:14px;top:12px;font-size:11px;color:var(--mute);display:flex;gap:12px}
.bmaps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bmap{width:100%;display:block}
.bmap path,.bmap ellipse,.bmap circle,.bmap rect{transition:fill .25s}
.bmap .m{fill:#E3DED4}
.bmap .n{fill:#B9B3A8}
.bmap .p{fill:var(--red)}
.bmap .s{fill:var(--red);fill-opacity:.45}
.bmap.click .m{cursor:pointer}
.bmap.click .m:hover{fill:#fff}
.bmap .sel{fill:var(--red)}
.cap{text-align:center;font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps li{list-style:none;display:flex;gap:12px;font-size:13px;line-height:1.5;color:#CFCAC1;margin-bottom:10px}
.steps li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bone)}
.warn{background:var(--redbg);border:1px solid rgba(229,72,77,.3);border-radius:14px;padding:12px;font-size:13px;line-height:1.5;color:#F3C9CA}
.prescr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prescr div{background:var(--s2);border-radius:14px;padding:10px;text-align:center}
.prescr b{display:block;font-size:15px;margin-top:4px}
.prescr small{font-size:10px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.thumb{width:62px;height:52px;border-radius:12px;background:#15161A;border:1px solid var(--line);flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%}
.ex-row .t small b{color:var(--bone);font-weight:700}
.day{margin-bottom:12px}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:16px 16px 0 0}
.day-h b{font-size:15px}
.day-h small{font-size:12px;color:var(--mute)}
.day-b{border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:0 16px}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prof .av{width:64px;height:64px;font-size:20px}
.prof h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.prof p{font-size:13px;color:var(--mute);margin-top:2px}
table.med{width:100%;border-collapse:collapse;font-size:13px}
table.med td,table.med th{padding:9px 0;border-bottom:1px solid var(--line);text-align:right}
table.med th{color:var(--dim);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
table.med td:first-child,table.med th:first-child{text-align:left;color:var(--mute)}
table.med tr:last-child td{border-bottom:0}
.up{color:var(--base)} .dn{color:var(--red2)}
.note{font-size:13px;line-height:1.6;color:#CFCAC1}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--s1);border-top:1px solid var(--line);border-radius:28px 28px 0 0;width:100%;padding:12px 20px 30px;animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 16px}
.sheet h4{font-size:19px;font-weight:800;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{font-size:12px;color:var(--mute);display:block;margin-bottom:6px;font-weight:600}
.fld input,.fld select{width:100%;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:0 14px;font-size:15px;outline:0}
.fld input:focus,.fld select:focus{border-color:var(--red)}
.big-in{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:10px 0 18px}
.big-in input{width:150px;background:none;border:0;border-bottom:2px solid var(--line);color:var(--bone);font-size:52px;font-weight:800;text-align:center;outline:0}
.big-in span{font-size:20px;color:var(--mute);font-weight:700}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--red);border-color:var(--red)}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--bone);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:9;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.seg2{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg2 button.on{background:var(--s3);color:var(--bone)}
html,body{min-height:100%}
body{background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;position:relative}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:none;overflow:visible;padding:max(14px,env(safe-area-inset-top)) 18px 120px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:max(14px,env(safe-area-inset-bottom))}
.sheet-bg{position:fixed;inset:0;display:none;justify-content:center;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:max(30px,env(safe-area-inset-bottom))}
.toast{position:fixed;top:18px;left:50%;max-width:90vw;white-space:normal;text-align:center}
.fld textarea{width:100%;min-height:80px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:12px 14px;font:inherit;font-size:15px;outline:0;resize:vertical}
.fld textarea:focus{border-color:var(--red)}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth{padding-top:34px}
.logo{display:flex;align-items:center;gap:14px}
.logo h1{font-size:34px;letter-spacing:.18em;font-weight:800}
.tag{font-size:28px;margin:18px 0 24px;line-height:1.15}
.tag em{color:var(--red)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 10px;font-size:12px;font-weight:700;color:var(--mute)}
.msg{font-size:13px;line-height:1.5;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.err{background:var(--redbg);border:1px solid rgba(229,72,77,.3);color:#F3C9CA}
.msg.ok{background:rgba(143,191,169,.12);border:1px solid rgba(143,191,169,.35);color:#CDE5D9}
.lnk{font-size:13px;color:var(--mute);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.center{text-align:center}
.btn[disabled]{opacity:.55;cursor:default}
.btn.danger{background:#7A2A2D}
.empty{text-align:center;padding:30px 18px}
.empty h3{font-size:20px;margin:12px 0 6px}
.empty p{font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:16px}
.mini{height:34px;padding:0 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:12px;font-weight:700}
.mini.red{color:var(--red2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--red);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cin{width:84px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:0 8px;font:inherit;font-size:13px;text-align:center;outline:0}
.cin:focus{border-color:var(--red)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.feel button{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:14px;color:var(--mute)}
.feel button.on{background:var(--bone);color:var(--bg);border-color:var(--bone)}
a.btn{text-decoration:none}
.hist{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist:last-child{border-bottom:0}
.hist small{color:var(--mute);display:block;margin-top:2px;line-height:1.4}
</style>
</head>

function traduzErro(e){
  const m=String((e&&(e.message||e.erro||e.error_description))||e||'');
  const c=(e&&e.code)||'';
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Você ainda não confirmou o e-mail. Abra a mensagem que enviamos e clique no link.';
  if(/already (registered|been registered)|already exists|já (existe|cadastrad)/i.test(m)||c==='user_already_exists')return 'Este e-mail já está cadastrado. Tente entrar ou recuperar a senha.';
  if(/weak|at least \d+ char|Password should/i.test(m)||c==='weak_password')return 'Senha fraca. Use pelo menos 8 caracteres.';
  if(/rate limit|For security purposes|too many/i.test(m)||c==='over_email_send_rate_limit')return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.';
  if(/same password|different from the old/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Sem conexão com a internet. Confira e tente de novo.';
  if(/Invalid email|valid email/i.test(m))return 'E-mail inválido.';
  if(/[áéíóúãõç]/i.test(m)&&m.length<200)return m;
  return 'Algo deu errado. Tente de novo em instantes.';
}

function chart(a){
  let ps=comPeso(a.id).map(r=>({v:Number(r.peso),d:String(r.data).slice(0,10)}));
  if(S.periodo==='4s'){const lim=addDias(hoje(),-28);ps=ps.filter(p=>p.d>=lim)}
  if(!ps.length)return'<p style="font-size:13px;color:var(--mute);padding:14px 0">Nenhuma pesagem neste período.</p>';
  const meta=a.meta_peso!=null?Number(a.meta_peso):null;
  const W=330,H=170,pl=14,pr=34,pt=18,pb=24;
  const all=ps.map(p=>p.v).concat(meta!=null?[meta]:[]);
  let mn=Math.min(...all)-1,mx=Math.max(...all)+1;
  const X=i=>pl+(ps.length===1?0.5:i/(ps.length-1))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=ps.map((p,i)=>[X(i),Y(p.v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+f1(p[0])+','+f1(p[1])).join(' ');
  const area=d+` L${f1(pts[pts.length-1][0])},${H-pb} L${f1(pts[0][0])},${H-pb}Z`;
  const lp=pts[pts.length-1];
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E5484D" stop-opacity=".28"/><stop offset="1" stop-color="#E5484D" stop-opacity="0"/></linearGradient></defs>`;
  if(meta!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${f1(Y(meta))}" y2="${f1(Y(meta))}" stroke="#D4B074" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-pr+4}" y="${f1(Y(meta)+4)}" fill="#D4B074" font-size="10" font-weight="700">meta</text>`;
  s+=`<path d="${area}" fill="url(#gg)"/><path d="${d}" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${last?5:3}" fill="${last?'#E5484D':'#141519'}" stroke="#E5484D" stroke-width="2"/>`;
    if(ps.length<=8||i%Math.ceil(ps.length/8)===0||last)s+=`<text x="${f1(p[0])}" y="${H-6}" fill="#6B675F" font-size="9" text-anchor="middle">${fmtDC(ps[i].d)}</text>`});
  s+=`<text x="${f1(lp[0])}" y="${f1(lp[1]-11)}" fill="#EDE8DF" font-size="11" font-weight="800" text-anchor="middle">${nf(ps[ps.length-1].v)}</text></svg>`;
  return s;
}

async function doLogin(e){

  msg('');busy('bt',true,'Entrando…');
  try{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
  catch(x){msg(traduzErro(x));busy('bt',false)}
  return false;
}
async function doSignup(e){
  e.preventDefault();const nome=val('f-nome').trim(),em=val('f-email').trim(),pw=val('f-pw1');
  if(nome.length<2){msg('Informe seu nome.');return false}
  if(!/^\S+@\S+\.\S+$/.test(em)){msg('Informe um e-mail válido.');return false}

async function onAuth(ev,ses){
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  if(!ses){
    if(ev==='INITIAL_SESSION'&&HASHTYPE&&!S.boot&&!S.hashWait){S.hashWait=true;setTimeout(()=>{if(!S.user){S.boot=true;S.screen='login';render()}},4000);return}
    S.boot=true;
    if(ev==='SIGNED_OUT'||!S.user){S.user=null;if(FAKE&&QS.get('tela')&&!S.telaOk){S.telaOk=1;S.screen=QS.get('tela')}else if(!['signup','signupDone','forgot','forgotDone'].includes(S.screen)){S.screen='login'}render()}
    return;
  }
  S.boot=true;
  const mesmo=S.user&&S.user.id===ses.user.id;
  S.user=ses.user;
  if(mesmo&&S.screen==='app')return;
  if(S.screen==='newpass')return;
  if((S.recovery||HASHTYPE==='invite'||HASHTYPE==='recovery')&&!S.pwdDone){S.screen='newpass';render();return}
  await carregarTudo();
  if(HASHTYPE==='signup'&&S.screen==='app'){try{history.replaceState(null,'',location.pathname)}catch(_){}toast('Conta confirmada!')}
}

  return head+`
  <div class="chips">${prog.dias.map((d,i)=>`<button class="${S.dia===i?'on':''}" onclick="S.dia=${i};S.feitos={};render()">${d.n}</button>`).join('')}</div>
  <div class="hero" style="background:linear-gradient(140deg,#E5484D26,transparent 60%),var(--s1);cursor:default"><div style="display:flex;gap:16px;align-items:center">
   <div class="ring"><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${R}" fill="none" stroke="#24272D" stroke-width="7"/><circle cx="37" cy="37" r="${R}" fill="none" stroke="#E5484D" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 37 37)"/></svg><b>${feitos}/${dia.ex.length}</b></div>
   <div><div style="font-size:12px;font-weight:700;color:${LV[nivel].hex};letter-spacing:.1em">${dia.n.toUpperCase()} · ${LV[nivel].nome.toUpperCase()}</div><h4 style="font-size:22px;margin-top:4px">${dia.f}</h4><p style="max-width:none">${prog.tempo}</p></div></div></div>
  ${ja?`<div class="alert"><i style="background:var(--base)"></i><div><b>Você já treinou hoje</b><small>${esc(ja.treino)} registrado. Pode fazer outro se quiser.</small></div></div>`:''}
  <div class="grid2"><div class="kpi"><small>Sequência</small><b>${sequencia(a.id)} ${sequencia(a.id)===1?'dia':'dias'}</b><span style="color:var(--mute)">dias seguidos treinando</span></div>
   <div class="kpi"><small>Últimos 7 dias</small><b>${sem}</b><span style="color:var(--mute)">${sem===1?'treino registrado':'treinos registrados'}</span></div></div>
  <div class="lbl">Exercícios <a onclick="go({type:'prog',n:'${nivel}'})">ver programa</a></div>
  <div class="card" style="padding:4px 16px">${dia.ex.map(k=>{const e=EX[k],f=S.feitos[k]||{},uc=ultCarga(k);return`<div class="row" style="cursor:default"><button class="check ${f.feito?'on':''}" onclick="toggleEx('${k}')" aria-label="Marcar">${f.feito?I.ok:''}</button>
   <div class="thumb" onclick="go({type:'ex',k:'${k}',n:'${nivel}'})">${stageSVG(k,e,true)}</div>
   <div class="t" onclick="go({type:'ex',k:'${k}',n:'${nivel}'})"><b style="${f.feito?'color:var(--mute);text-decoration:line-through':''}">${e.nome}</b><small><b>${e.pres[nivel]}</b>${uc?' · última: '+esc(uc):''}</small></div>
   <input class="cin" placeholder="carga" value="${esc(f.carga||'')}" oninput="setCarga('${k}',this.value)" aria-label="Carga"></div>`}).join('')}</div>
  <button class="btn" onclick="feedbackSheet()" ${feitos?'':'disabled'}>Concluir treino</button>
  ${trs.length?`<div class="lbl">Últimos treinos</div><div class="card" style="padding:4px 16px">${trs.slice(0,5).map(histTreino).join('')}</div>`:''}`;
};
function toggleEx(k){const f=S.feitos[k]||(S.feitos[k]={});f.feito=!f.feito;render()}
function setCarga(k,v){const f=S.feitos[k]||(S.feitos[k]={});f.carga=v;}
function feedbackSheet(){
  S.feel='ok';
  openSheet(`<h4>Como foi o treino?</h4><div class="feel" id="feel">${[['facil','Fácil'],['ok','Ok'],['pesado','Pesado']].map(([k,n])=>`<button class="${k==='ok'?'on':''}" onclick="setFeel('${k}')">${n}</button>`).join('')}</div>
  <div class="fld"><label>Quer contar mais? (opcional)</label><textarea id="fb-tx" maxlength="500" placeholder="Ex.: senti o ombro no desenvolvimento"></textarea></div>
  <button class="btn" id="bt-fb" onclick="salvarTreino()">Salvar treino</button>`);
}
function setFeel(k){S.feel=k;[...document.querySelectorAll('#feel button')].forEach((b,i)=>b.classList.toggle('on',['facil','ok','pesado'][i]===k))}
async function salvarTreino(){
  const a=S.alunos[0],nivel=LV[a.nivel]?a.nivel:'base',dia=PROG[nivel].dias[S.dia];
  const nome={facil:'Fácil',ok:'Ok',pesado:'Pesado'}[S.feel],tx=val('fb-tx').trim();
  const row={aluno_id:a.id,data:hoje(),treino:dia.n,exercicios:dia.ex.map(k=>({chave:k,feito:!!(S.feitos[k]&&S.feitos[k].feito),carga:(S.feitos[k]&&S.feitos[k].carga||'').trim()})),feedback:nome+(tx?': '+tx:'')};
  busy('bt-fb',true,'Salvando…');
  try{const r=await Q(sb.from('apice_treinos_feitos').insert(row).select().single());
    (S.trs[a.id]=S.trs[a.id]||[]).push(r);sortTrs(a.id);S.feitos={};S.dia=null;closeSheet();render();toast('Treino registrado. Bom trabalho!')}
  catch(e){busy('bt-fb',false);toast(traduzErro(e))}
}
/* ================= FORMULÁRIOS ================= */
const inp=(id,label,v,extra)=>`<div class="fld"><label>${label}</label><input id="${id}" value="${esc(v==null?'':v)}" ${extra||''}></div>`;
function novoAluno(){alunoSheet(null)}
function alunoSheet(id){
  const a=id?aluno(id):{};
  openSheet(`<h4>${id?'Editar aluno':'Novo aluno'}</h4>
  ${inp('al-nome','Nome *',a.nome,'placeholder="Nome completo" autocomplete="off"')}
  ${inp('al-email','E-mail (para o convite)',a.email,'type="email" inputmode="email" placeholder="aluno@email.com"')}
  ${inp('al-tel','WhatsApp',a.telefone,'inputmode="tel" placeholder="(11) 99999-9999"')}
  <div class="g3">${inp('al-nasc','Nascimento',a.nascimento,'type="date"')}${inp('al-alt','Altura (m)',a.altura!=null?nf(a.altura,2):'','inputmode="decimal" placeholder="1,75"')}</div>
  <div class="g3"><div class="fld"><label>Sexo</label><select id="al-sexo"><option value="">Não informar</option>${[['feminino','Feminino'],['masculino','Masculino']].map(([k,n])=>`<option value="${k}" ${a.sexo===k?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="fld"><label>Nível</label><select id="al-nivel">${['base','forte','palco'].map(n=>`<option value="${n}" ${(a.nivel||'base')===n?'selected':''}>${LV[n].nome} · ${LV[n].sub}</option>`).join('')}</select></div></div>
  ${inp('al-obj','Objetivo',a.objetivo,'placeholder="Hipertrofia, emagrecimento, campeonato…"')}
  ${inp('al-meta','Meta de peso (kg)',a.meta_peso!=null?nf(a.meta_peso):'','inputmode="decimal" placeholder="75,0"')}
  <div class="fld"><label>Anotação</label><textarea id="al-nota" placeholder="Observações do personal">${esc(a.nota||'')}</textarea></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="bt-al" onclick="salvarAluno('${id?esc(id):''}')">${id?'Salvar alterações':'Cadastrar aluno'}</button>
  ${id?`<button class="btn ghost" style="margin-top:8px;color:var(--red2)" onclick="excluirAluno('${esc(id)}')">Excluir aluno</button>`:''}`);
}
async function salvarAluno(id){
  const nome=val('al-nome').trim();if(!nome){msg('Digite o nome do aluno.');return}
  const email=val('al-email').trim();if(email&&!/^\S+@\S+\.\S+$/.test(email)){msg('E-mail inválido.');return}
  let alt=pnum(val('al-alt'));if(alt!=null&&alt>3)alt=alt/100;
  const meta=pnum(val('al-meta'));
  if(Number.isNaN(alt)||(alt!=null&&(alt<0.5||alt>2.5))){msg('Altura inválida. Use metros, por exemplo 1,75.');return}
  if(Number.isNaN(meta)||(meta!=null&&(meta<20||meta>400))){msg('Meta de peso inválida.');return}
  const row={nome,email:email||null,telefone:val('al-tel').trim()||null,nascimento:val('al-nasc')||null,altura:alt,sexo:val('al-sexo')||null,nivel:val('al-nivel'),objetivo:val('al-obj').trim()||null,meta_peso:meta,nota:val('al-nota').trim()||null};
  msg('');busy('bt-al',true,'Salvando…');
  try{
    if(id){const r=await Q(sb.from('apice_alunos').update(row).eq('id',id).select().single());Object.assign(aluno(id),r);closeSheet();render();toast('Aluno atualizado')}
    else{row.personal_id=S.user.id;row.ativo=true;const r=await Q(sb.from('apice_alunos').insert(row).select().single());
      S.alunos.push(r);S.alunos.sort((x,y)=>String(x.nome).localeCompare(String(y.nome),'pt-BR'));S.regs[r.id]=[];S.trs[r.id]=[];
      closeSheet();S.tab='alunos';S.stack=[{type:'aluno',id:r.id}];render();toast('Aluno cadastrado')}
  }catch(e){busy('bt-al',false);msg(traduzErro(e))}
}
function excluirAluno(id){
  const a=aluno(id);
  confirmar('Excluir aluno?',`${a.nome} e todo o histórico de avaliações e treinos dele serão apagados. Isso não pode ser desfeito.`,'Sim, excluir aluno',async()=>{
    const {error}=await sb.from('apice_alunos').delete().eq('id',id);if(error)throw error;
    S.alunos=S.alunos.filter(x=>x.id!==id);delete S.regs[id];delete S.trs[id];S.stack=[];closeSheet();render();toast('Aluno excluído');
  });
}
function avalSheet(alunoId,regId){
  const a=aluno(alunoId),r=regId?regsDe(alunoId).find(x=>x.id===regId):{},m=r.medidas||{};
  const n=v=>v!=null?nf(v):'';
  openSheet(`<h4>${regId?'Editar avaliação':'Nova avaliação'} · ${primeiro(a.nome)}</h4>
  ${inp('av-data','Data',r.data?String(r.data).slice(0,10):hoje(),'type="date"')}
  <div class="g3">${inp('av-peso','Peso (kg)',n(r.peso),'inputmode="decimal" placeholder="75,0"')}${inp('av-gord','% de gordura',n(r.gordura),'inputmode="decimal" placeholder="18,0"')}</div>
  <div class="lbl" style="margin:8px 0 8px">Medidas (cm)</div>
  <div class="g3">${inp('av-cintura','Cintura',n(m.cintura),'inputmode="decimal"')}${inp('av-quadril','Quadril',n(m.quadril),'inputmode="decimal"')}${inp('av-braco','Braço',n(m.braco),'inputmode="decimal"')}${inp('av-coxa','Coxa',n(m.coxa),'inputmode="decimal"')}${inp('av-peito','Peito',n(m.peito),'inputmode="decimal"')}</div>
  <div class="fld"><label>Observação</label><textarea id="av-obs" placeholder="Como o aluno está, ajustes, etc.">${esc(r.obs||'')}</textarea></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="bt-av" onclick="salvarAval('${esc(alunoId)}','${regId?esc(regId):''}')">Salvar avaliação</button>`);
}
async function salvarAval(alunoId,regId){
  const data=val('av-data');if(!data){msg('Informe a data.');return}
  const peso=pnum(val('av-peso')),gord=pnum(val('av-gord'));const med={};let bad=false;
  for(const k of ['cintura','quadril','braco','coxa','peito']){const v=pnum(val('av-'+k));if(Number.isNaN(v)||(v!=null&&(v<=0||v>300)))bad=true;else if(v!=null)med[k]=v}
  if(bad||Number.isNaN(peso)||Number.isNaN(gord)){msg('Confira os números digitados.');return}
  if(peso!=null&&(peso<20||peso>400)){msg('Peso fora do esperado (20 a 400 kg).');return}
  if(gord!=null&&(gord<1||gord>70)){msg('% de gordura fora do esperado (1 a 70).');return}
  if(peso==null&&gord==null&&!Object.keys(med).length){msg('Preencha ao menos o peso, a gordura ou uma medida.');return}
  const row={aluno_id:alunoId,data,peso,gordura:gord,medidas:Object.keys(med).length?med:null,obs:val('av-obs').trim()||null};
  msg('');busy('bt-av',true,'Salvando…');
  try{
    if(regId){const r=await Q(sb.from('apice_registros').update(row).eq('id',regId).select().single());const l=S.regs[alunoId];l[l.findIndex(x=>x.id===regId)]=r}
    else{row.criado_por=S.user.id;const r=await Q(sb.from('apice_registros').insert(row).select().single());(S.regs[alunoId]=S.regs[alunoId]||[]).push(r)}
    sortRegs(alunoId);closeSheet();render();toast('Avaliação salva')
  }catch(e){busy('bt-av',false);msg(traduzErro(e))}
}
function pesoSheet(alunoId){
  const pr=comPeso(alunoId),u=pr.length?Number(pr[pr.length-1].peso):'';
  openSheet(`<h4>Registrar meu peso</h4><div class="big-in"><input id="pw" inputmode="decimal" value="${u!==''?nf(u):''}" placeholder="0,0"><span>kg</span></div>
  ${inp('pw-data','Data',hoje(),'type="date"')}<div class="msg" id="msg"></div>
  <button class="btn" id="bt-pw" onclick="salvarPeso('${esc(alunoId)}')">Salvar peso</button>`);
}
async function salvarPeso(alunoId){
  const p=pnum(val('pw')),data=val('pw-data');
  if(p==null||Number.isNaN(p)||p<20||p>400){msg('Digite um peso válido (20 a 400 kg).');return}
  if(!data){msg('Informe a data.');return}
  msg('');busy('bt-pw',true,'Salvando…');
  try{const r=await Q(sb.from('apice_registros').insert({aluno_id:alunoId,data,peso:p,criado_por:S.user.id}).select().single());
    (S.regs[alunoId]=S.regs[alunoId]||[]).push(r);sortRegs(alunoId);closeSheet();render();toast('Peso registrado')}
  catch(e){busy('bt-pw',false);msg(traduzErro(e))}
}
function apagarReg(alunoId,regId){
  const r=regsDe(alunoId).find(x=>x.id===regId);
  confirmar('Apagar avaliação?',`A avaliação de ${fmtD(r.data)} será removida do histórico.`,'Sim, apagar',async()=>{
    const {error}=await sb.from('apice_registros').delete().eq('id',regId);if(error)throw error;
    S.regs[alunoId]=S.regs[alunoId].filter(x=>x.id!==regId);closeSheet();render();toast('Avaliação apagada');
  });
}

iniciar();
</script>
</body>
</html>
