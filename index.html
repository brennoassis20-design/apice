<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png?v=3">
<link rel="apple-touch-icon" href="icone-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ápice">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ápice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F12; --s1:#17191D; --s2:#1F2227; --s3:#2A2D33; --line:#26292F;
  --bone:#F2F2F2; --mute:#A1A7B0; --dim:#8E949D;
  --acc:#3DDC84; --acc-ink:#06210F; --accbg:rgba(61,220,132,.12);
  --red:#FF6B6B; --red2:#FF8C8C; --redbg:rgba(255,107,107,.12);
  --warn:#F5A524; --musc:#E5484D;
  --base:#3DDC84; --forte:#A1A7B0; --palco:#A1A7B0;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Inter,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}

.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 110px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:66px;border-radius:24px;background:rgba(27,29,34,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:4}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--dim);width:72px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--bone)}
.tabbar button.on svg{color:var(--red)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}
.hd h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hd p{font-size:13px;color:var(--mute)}
.av{width:42px;height:42px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;border:1px solid var(--line)}
.back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin:4px 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{font-size:11px;color:var(--mute);display:block}
.kpi b{font-size:24px;font-weight:800;display:block;margin-top:6px;letter-spacing:-.02em}
.kpi span{font-size:11px;color:var(--base)}
.kpi span.neg{color:var(--red2)}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between}
.lbl a{letter-spacing:0;text-transform:none;color:var(--mute);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:12px;color:var(--mute)}
.chev{color:var(--dim)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em;white-space:nowrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-size:13px;line-height:1.4;cursor:pointer}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert small{color:var(--mute);display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;background:var(--red);color:#fff;font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:var(--s2);color:var(--bone);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.chips button.on{background:var(--bone);color:var(--bg);border-color:var(--bone)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s2);font-size:14px;font-weight:600;color:var(--mute);min-height:42px}
.opts.yn button{flex:1;border-radius:14px}
.opts button.on{background:var(--bone);color:var(--bg);border-color:var(--bone)}
.opts button.on.sim{background:var(--red);color:#fff;border-color:var(--red)}
.pq{padding:10px 0;border-bottom:1px solid var(--line)}
.pq p{font-size:14px;line-height:1.4;margin-bottom:8px;overflow-wrap:anywhere}
.an-sim{color:var(--red2);font-weight:800}
.anl{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.anl:last-child{border-bottom:0}
.anl small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;margin-bottom:12px;color:var(--mute)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--bone);font-size:16px}
.bar{height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px}
.hero{border-radius:22px;padding:20px;position:relative;overflow:hidden;margin-bottom:12px;cursor:pointer;border:1px solid var(--line)}
.hero h4{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5;max-width:80%}
.hero .meta{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--bone);font-weight:600}
.hero .step{position:absolute;right:16px;top:16px;font-size:12px;font-weight:600;color:var(--mute)}
.stage{background:var(--s1);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%}
.stage .ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.stage .ctl button{height:30px;padding:0 12px;border-radius:99px;background:rgba(36,39,45,.9);border:1px solid var(--line);font-size:12px;font-weight:700}
.stage .ctl button.on{background:var(--bone);color:var(--bg)}
.stage .lg{position:absolute;left:14px;top:12px;font-size:11px;color:var(--mute);display:flex;gap:12px}
.bmaps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bmap{width:100%;display:block}
.bmap path,.bmap ellipse,.bmap circle,.bmap rect{transition:fill .25s}
.bmap .sk{fill:#CFC9BF;stroke:#CFC9BF;stroke-width:.8}
.bmap .ln{fill:none;stroke:#A9A398;stroke-width:.7;stroke-linecap:round}
.bmap .m{fill:#E6E1D8;stroke:#B3ACA0;stroke-width:.6}
.bmap .p{fill:var(--red);stroke:#B8343A}
.bmap .s{fill:#9B3B3F;stroke:#7E2D31}
.bmap.click .m{cursor:pointer}
.bmap.click .m:hover{fill:#fff}
.bmap .sel{fill:var(--red);stroke:#B8343A}
.inst{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.inst b{color:var(--bone)}.inst span{flex:1;color:var(--mute)}
.inst .go{background:var(--red);color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:12.5px}
.inst .x{color:var(--dim);font-size:18px;padding:0 4px}
.passos{list-style:none;counter-reset:n;margin:6px 0 14px}
.passos li{counter-increment:n;position:relative;padding:9px 0 9px 36px;font-size:14.5px;line-height:1.45;color:#CFCAC1;border-bottom:1px solid var(--line)}
.passos li:last-child{border-bottom:0}
.passos li:before{content:counter(n);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--redbg);color:var(--red2);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--s2);border-radius:12px;padding:4px;margin:4px 0 8px}
.seg button{padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--s3);color:var(--bone)}
.ico-in{display:inline-block;vertical-align:-3px}
.cap{text-align:center;font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps li{list-style:none;display:flex;gap:12px;font-size:13px;line-height:1.5;color:#CFCAC1;margin-bottom:10px}
.steps li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bone)}
.warn{background:var(--redbg);border:1px solid rgba(229,72,77,.3);border-radius:14px;padding:12px;font-size:13px;line-height:1.5;color:#F3C9CA}
.prescr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prescr div{background:var(--s2);border-radius:14px;padding:10px;text-align:center}
.prescr b{display:block;font-size:15px;margin-top:4px}
.prescr small{font-size:10px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.thumb{width:62px;height:52px;border-radius:12px;background:#15161A;border:1px solid var(--line);flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%}
.ex-row .t small b{color:var(--bone);font-weight:700}
.day{margin-bottom:12px}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:16px 16px 0 0}
.day-h b{font-size:15px}
.day-h small{font-size:12px;color:var(--mute)}
.day-b{border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:0 16px}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hd-acoes{display:flex;align-items:center;gap:8px;flex:none}
.sino{position:relative;width:42px;height:42px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--bone)}
.sino i{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--s1)}
.nov{padding:12px 0;border-bottom:1px solid var(--line)}.nov:last-child{border-bottom:0}
.nov h3{font-size:16px;margin:2px 0 4px}.nov p{font-size:14px;line-height:1.5;color:#CFCAC1}.nov .nov-d{font-size:12px;color:var(--dim)}
.prof .av{width:64px;height:64px;font-size:20px}
.prof h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.prof p{font-size:13px;color:var(--mute);margin-top:2px}
table.med{width:100%;border-collapse:collapse;font-size:13px}
table.med td,table.med th{padding:9px 0;border-bottom:1px solid var(--line);text-align:right}
table.med th{color:var(--mute);font-weight:600;font-size:12px}
table.med td:first-child,table.med th:first-child{text-align:left;color:var(--mute)}
table.med tr:last-child td{border-bottom:0}
.up{color:var(--base)} .dn{color:var(--red2)}
.note{font-size:13px;line-height:1.6;color:#CFCAC1}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--s1);border-top:1px solid var(--line);border-radius:28px 28px 0 0;width:100%;padding:12px 20px 30px;animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 16px}
.sheet h4{font-size:19px;font-weight:800;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{font-size:12px;color:var(--mute);display:block;margin-bottom:6px;font-weight:600}
.fld input,.fld select{width:100%;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:0 14px;font-size:16px;outline:0}
.fld input:focus,.fld select:focus{border-color:var(--red)}
.big-in{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:10px 0 18px}
.big-in input{width:150px;background:none;border:0;border-bottom:2px solid var(--line);color:var(--bone);font-size:52px;font-weight:800;text-align:center;outline:0}
.big-in span{font-size:20px;color:var(--mute);font-weight:700}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--red);border-color:var(--red)}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--bone);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:9;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.seg2{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg2 button.on{background:var(--s3);color:var(--bone)}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
html,body{overflow-x:hidden}
body{background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;position:relative}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:none;overflow:visible;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 132px)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:max(14px,env(safe-area-inset-bottom))}
.sheet-bg{position:fixed;inset:0;display:none;justify-content:center;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:max(30px,env(safe-area-inset-bottom))}
.toast{position:fixed;top:max(18px,calc(env(safe-area-inset-top) + 8px));left:50%;max-width:90vw;white-space:normal;text-align:center}
.fld textarea{width:100%;min-height:80px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:12px 14px;font:inherit;font-size:16px;outline:0;resize:vertical}
.fld textarea:focus{border-color:var(--red)}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth{padding-top:34px}
.logo{display:flex;align-items:center;gap:14px}
.logo h1{font-size:34px;letter-spacing:.18em;font-weight:800}
.tag{font-size:28px;margin:18px 0 24px;line-height:1.15}
.tag em{color:var(--red)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 10px;font-size:12px;font-weight:700;color:var(--mute)}
.msg{font-size:13px;line-height:1.5;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.err{background:var(--redbg);border:1px solid rgba(229,72,77,.3);color:#F3C9CA}
.msg.ok{background:rgba(143,191,169,.12);border:1px solid rgba(143,191,169,.35);color:#CDE5D9}
.lnk{font-size:13px;color:var(--mute);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.center{text-align:center}
.btn[disabled]{opacity:.55;cursor:default}
.btn.danger{background:#7A2A2D}
.empty{text-align:center;padding:30px 18px}
.empty h3{font-size:20px;margin:12px 0 6px}
.empty p{font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:16px}
.mini{height:34px;padding:0 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:12px;font-weight:700}
.mini.red{color:var(--red2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--red);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cin{width:84px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:0 8px;font:inherit;font-size:13px;text-align:center;outline:0}
.cin:focus{border-color:var(--red)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.feel button{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:14px;color:var(--mute)}
.feel button.on{background:var(--bone);color:var(--bg);border-color:var(--bone)}
a.btn{text-decoration:none}
.exw{border-bottom:1px solid var(--line)}
.exw:last-child{border-bottom:0}
.exw .row{border-bottom:0}
.sers{padding:0 0 14px}
.ser{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.ser>span{font-size:12px;font-weight:700;color:var(--mute)}
.sin{width:100%;min-width:0;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:0 10px;font:inherit;font-size:16px;text-align:center;outline:0}
.sin:focus{border-color:var(--red)}
.ser.ok .sin{opacity:.6}
.sok{height:44px;width:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:18px;font-weight:800}
.sok.on{background:var(--base);border-color:var(--base);color:var(--bg)}
.sh{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.rest{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);height:52px;border-radius:18px;background:var(--s2);border:1px solid var(--red);display:none;align-items:center;gap:8px;padding:0 10px 0 16px;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.rest.on{display:flex}
.rest b{font-size:15px;flex:1;white-space:nowrap}
.rest button{height:34px;padding:0 11px;border-radius:10px;background:var(--s3);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--bone)}
.rest button.pl{background:var(--red);border-color:var(--red)}
.hist{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist:last-child{border-bottom:0}
.resp{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--s2);border-left:3px solid var(--red);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.resp b{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.resp-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.resp-a .mini,.resp-a a{height:36px;padding:0 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--bone);font-size:13px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.resp-f textarea{width:100%;min-height:76px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--bone);padding:10px 12px;font:inherit;font-size:16px;outline:0;resize:vertical;margin-top:8px}
.resp-f .cnt{font-size:12px;color:var(--mute);text-align:right}
.hist small{color:var(--mute);display:block;margin-top:2px;line-height:1.4}

  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Sem conexão com a internet. Confira e tente de novo.';
  if(/Invalid email|valid email/i.test(m))return 'E-mail inválido.';

async function doLogin(e){
  e.preventDefault();const em=val('f-email').trim(),pw=val('f-senha');
  if(!em||!pw){msg('Informe e-mail e senha.');return false}
  msg('');busy('bt',true,'Entrando…');
  try{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
  catch(x){msg(traduzErro(x));busy('bt',false)}
  return false;
}
async function doSignup(e){
  e.preventDefault();const nome=val('f-nome').trim(),em=val('f-email').trim(),pw=val('f-pw1');
  if(nome.length<2){msg('Informe seu nome.');return false}
  if(!/^\S+@\S+\.\S+$/.test(em)){msg('Informe um e-mail válido.');return false}
  if(pw.length<8){msg('A senha precisa ter pelo menos 8 caracteres.');return false}
  msg('');busy('bt',true,'Criando…');
  try{await apiEmail({acao:'cadastro',nome,email:em,senha:pw});S.aviso=em;irAuth('signupDone')}
  catch(x){msg(traduzErro(x));busy('bt',false)}
  return false;
}

  if(tipo==='cnpj')return d.length===14?{v:d}:{erro:'CNPJ precisa ter 14 números.'};
  if(tipo==='email')return /^\S+@\S+$/.test(r)&&r.length<=120?{v:r.toLowerCase()}:{erro:'E-mail inválido.'};
  if(tipo==='telefone'){let n=d;if((n.length===12||n.length===13)&&n.startsWith('55'))n=n.slice(2);return n.length===10||n.length===11?{v:'+55'+n}:{erro:'Telefone com DDD, 10 ou 11 números.'}}
  if(tipo==='aleatoria')return r.length>=8&&r.length<=120&&!/\s/.test(r)?{v:r}:{erro:'Chave aleatória inválida.'};

}
function pixMostra(tipo,v){

}

  if(pago)return Object.assign(base,{estado:'pago',dias:0,txt:'Pago ✓ em '+fmtDC(pago.marcado_em||pago.criado||venc),cor:'var(--base)'});

/* ---- evolução (comum à ficha e ao aluno) ---- */
function avaliacoesHTML(a){
  const tudo=regsDe(a.id).slice().reverse(),l=S.avTodas===a.id?tudo:tudo.slice(0,3);
  if(!tudo.length)return'<p style="font-size:14px;color:var(--mute);padding:10px 0">Nenhuma avaliação registrada.</p>';
  const lab={cintura:'cintura',quadril:'quadril',braco:'braço',coxa:'coxa',peito:'peito'};
  return l.map(r=>{
    const pode=eP()||r.criado_por===S.user.id;
    const m=r.medidas?Object.entries(r.medidas).filter(([k,v])=>v!=null&&lab[k]).map(([k,v])=>`${lab[k]} ${nf(v)}`).join(' · '):'';
    return`<div class="hist"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${fmtD(r.data)}</b>
     <span style="font-weight:700">${r.peso!=null?nf(r.peso)+' kg':''}${r.gordura!=null?` · ${nf(r.gordura)}%`:''}</span></div>
     ${m?`<small>${esc(m)} (cm)</small>`:''}${r.obs?`<small>${esc(r.obs)}</small>`:''}
     ${pode?`<div style="display:flex;gap:8px;margin-top:8px"><button class="mini" onclick="avalSheet('${esc(a.id)}','${esc(r.id)}')">Editar</button><button class="mini" onclick="fotosSheet('${esc(a.id)}','${esc(r.id)}','${esc(String(r.data).slice(0,10))}')">Fotos</button><button class="mini red" onclick="apagarReg('${esc(a.id)}','${esc(r.id)}')">Apagar</button></div>`:''}</div>`}).join('')+(tudo.length>l.length?`<div class="hist"><button class="lnk" style="color:var(--acc);text-decoration:none" onclick="S.avTodas='${esc(a.id)}';rr()">Ver todas as ${tudo.length} avaliações</button></div>`:'');
}
function evolHTML(a){
  const pr=comPeso(a.id),p=pr.length?Number(pr[pr.length-1].peso):null,d=pr.length>1?p-Number(pr[0].peso):null;
  const g=regsDe(a.id).filter(r=>r.gordura!=null),gl=g.length?Number(g[g.length-1].gordura):null,gd=g.length>1?gl-Number(g[0].gordura):null;
  const imc=p!=null&&a.altura?p/(a.altura*a.altura):null;
  const meta=a.meta_peso!=null?Number(a.meta_peso):null;
  const med=medidasResumo(a.id);
  return`<div class="grid2">
   <div class="kpi"><small>Peso atual</small><b>${p!=null?nf(p)+' kg':'—'}</b><span>${d!=null?`<b class="${clsPeso(a,d)}" style="font-size:12px;display:inline;margin:0">${d>0?'+':''}${nf(d)} kg</b> em ${pr.length} registros`:'sem variação ainda'}</span></div>
   <div class="kpi"><small>Gordura corporal</small><b>${gl!=null?nf(gl)+'%':'—'}</b><span>${gd!=null?`<b class="${gd<0?'up':gd>0?'dn':'neu'}" style="font-size:12px;display:inline;margin:0">${gd>0?'+':''}${nf(gd)} pts</b> desde o início`:'sem comparação'}</span></div>
   <div class="kpi"><small>IMC</small><b>${imc!=null?nf(imc):'—'}</b><span style="color:var(--mute)">${a.altura?'altura '+nf(a.altura,2)+' m':'sem altura'}</span></div>
   <div class="kpi"><small>Meta de peso</small><b>${meta!=null?nf(meta)+' kg':'—'}</b><span>${meta!=null&&p!=null?(Math.abs(meta-p)<.05?'meta atingida':`faltam ${nf(Math.abs(meta-p))} kg`):''}</span></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:15px">Evolução do peso</b>
   <div class="seg2" style="margin:0;width:130px"><button class="${S.periodo==='4s'?'on':''}" onclick="S.periodo='4s';render()">4 sem</button><button class="${S.periodo==='tudo'?'on':''}" onclick="S.periodo='tudo';render()">Tudo</button></div></div>
   ${chart(a)}</div>
  ${cargaCard(a)}
  <div class="card"><b style="font-size:15px">Medidas (cm)</b>
   ${med.length?`<table class="med" style="margin-top:6px"><tr><th></th><th>Início</th><th>Atual</th><th>Dif.</th></tr>${med.map(m=>{const df=m.f-m.i;const bom=(m.k==='cintura'||m.k==='quadril')?df<0:df>0;return`<tr><td>${m.n}</td><td>${nf(m.i)}</td><td><b>${nf(m.f)}</b></td><td class="${df===0?'':bom?'up':'dn'}">${df>0?'+':''}${nf(df)}</td></tr>`}).join('')}</table>`:'<p style="font-size:13px;color:var(--mute);padding-top:8px">Nenhuma medida registrada.</p>'}</div>
  ${fotosCard(a)}
  <div class="lbl">Avaliações</div><div class="card" style="padding:4px 16px">${avaliacoesHTML(a)}</div>`;
}
V.evol=()=>{
  const a=S.alunos[0];
  const head=`<div class="hd"><div><p>Seu progresso</p><h2>Evolução</h2></div>${avBtn()}</div>`;
  if(!a)return head+semAluno();
  return head+evolHTML(a)+`<button class="btn" onclick="pesoSheet('${esc(a.id)}')">${I.plus} Registrar meu peso</button>`;
};
const semAluno=()=>`<div class="card empty"><h3>Seu treino ainda não foi liberado</h3><p>Não encontramos um cadastro de aluno ligado a esta conta. Peça ao seu personal para enviar o convite novamente.</p></div>`;

/* ---- ficha do aluno ---- */
function statusConvite(a){
  if(a.user_id)return{t:'Já usa o app',c:'var(--base)'};
  if(a.convidado_em)return{t:'Convite enviado em '+fmtTs(a.convidado_em),c:'var(--palco)'};
  return{t:'Sem acesso ao app',c:'var(--mute)'};
}
function waLink(a){
  let d=String(a.telefone||'').replace(/\D/g,'');if(!d)return null;
  if(d.length<=11)d='55'+d;
  return'https://wa.me/'+d+'?text='+encodeURIComponent(`Oi ${String(a.nome).trim().split(/\s+/)[0]}! Te mandei o convite do app Ápice no seu e-mail.`);
}
function fTab(t){const v=S.stack[S.stack.length-1];if(v){v.tab=t;render()}}
function anAviso(a){
  const row=S.anam&&S.anam[a.id];if(!row||!row.alerta)return'';
  const r=row.respostas||{},it=[];
  if(String(r.lesoes||'').trim())it.push(String(r.lesoes).trim());
  (r.doencas||[]).forEach(d=>it.push(d==='outra'&&r.doenca_outra?r.doenca_outra:anLabel('doencas',d)));
  if(r.gestante==='sim')it.push('gestante');
  if((r.parq||[]).some(x=>x==='sim'))it.push('respondeu Sim no PAR-Q');
  return`<div class="anwarn" onclick="fTab('saude')">${I.warn}<div><b>Atenção na anamnese</b><small>${esc(it.slice(0,3).join(' · '))}${it.length>3?' …':''}</small></div></div>`;
}
V.aluno=v=>{
  const a=aluno(v.id);if(!a)return'<button class="back" onclick="back()">'+I.back+' Voltar</button><p>Aluno não encontrado.</p>';
  const lv=LV[a.nivel]||LV.base,id=a.id,idd=idade(a.nascimento),sc=statusConvite(a),wa=waLink(a),hist=trsDe(id).slice(0,8),tab=v.tab||'treino';
  const T=[['treino','Treino'],['evol','Evolução'],['saude','Saúde'],['conta','Conta']];
  let body='';
  if(tab==='treino')body=`<div class="lbl" style="margin-top:6px">Fichas de treino</div>${treinoAlunoCard(a)}
   <div class="lbl">Treinos feitos</div>
   <div class="card" style="padding:4px 16px">${hist.length?hist.map(histTreino).join(''):'<p style="font-size:14px;color:var(--mute);padding:12px 0">Nenhum treino registrado ainda.</p>'}</div>
   ${a.nota?`<div class="lbl">Anotação</div><div class="card note">${esc(a.nota)}</div>`:''}`;
  else if(tab==='evol')body=`<button class="btn" style="margin:6px 0 14px" onclick="avalSheet('${esc(id)}')">${I.plus} Nova avaliação</button>${evolHTML(a)}`;
  else if(tab==='saude')body=anamCardPersonal(a)||'<p style="font-size:14px;color:var(--mute);padding:12px 0">Anamnese indisponível.</p>';
  else body=`${mensalCardPersonal(a)||`<div class="lbl" style="margin-top:6px">Mensalidade</div><div class="card"><p style="font-size:14px;color:var(--mute);line-height:1.5;margin-bottom:12px">Nenhuma mensalidade cadastrada para este aluno.</p><button class="btn ghost" onclick="alunoSheet('${esc(id)}')">Cadastrar valor e vencimento</button></div>`}
   <div class="lbl">Acesso ao app</div>
   <div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><i class="dot" style="background:${sc.c};margin:0"></i><b style="font-size:15px">${esc(sc.t)}</b></div>
    <p style="font-size:13px;color:var(--mute);margin-bottom:12px">${a.email?'E-mail: '+esc(a.email):'Cadastre o e-mail do aluno para poder convidar.'}</p>
    <button class="btn${a.user_id?' ghost':''}" id="bt-conv" ${a.email?'':'disabled'} onclick="convidar('${esc(id)}')">${a.user_id?'Reenviar acesso':a.convidado_em?'Reenviar convite':'Convidar para o app'}</button>
    ${wa?`<a class="btn ghost" style="margin-top:8px" href="${esc(wa)}" target="_blank" rel="noopener">${I.msg} Avisar pelo WhatsApp</a>`:'<p style="font-size:13px;color:var(--mute);margin-top:8px">Cadastre o WhatsApp para enviar o aviso.</p>'}</div>`;
  return`<button class="back" onclick="back()">${I.back} Alunos</button>
  <div class="prof"><div class="av" style="border:2px solid ${lv.hex}">${esc(ini(a.nome))}</div><div style="flex:1;min-width:0"><h3>${esc(a.nome)}</h3>
   <p>${[idd!=null?idd+' anos':'',a.altura?nf(a.altura,2)+' m':'',a.objetivo].filter(Boolean).map(esc).join(' · ')||'Sem dados complementares'}</p><div style="margin-top:6px">${badge(a.nivel)}</div></div>
   <button class="mini" style="flex:none" onclick="alunoSheet('${esc(id)}')">Editar</button></div>
  ${anAviso(a)}
  <div class="ftabs" role="tablist">${T.map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" onclick="fTab('${k}')">${n}</button>`).join('')}</div>
  ${body}`;
};
function treinoAlunoCard(a){
  const fs=fichasDe(a.id),id=esc(a.id),lv=LV[a.nivel]||LV.base;
  const lista=fs.length?fs.map((f,i)=>{const fid=esc(f.id),n=exs(f).length;
    return`<div class="fch"><div class="row" onclick="editarFicha('${fid}')"><div class="t"><b>${esc(f.nome)}</b><small>${esc(f.foco||'Sem foco definido')} · ${n} ${n===1?'exercício':'exercícios'}</small></div><span class="chev">${I.chev}</span></div>
     <div class="fch-a"><button class="mini" ${i?'':'disabled'} onclick="moverFicha('${fid}',-1)" aria-label="Subir">↑</button><button class="mini" ${i<fs.length-1?'':'disabled'} onclick="moverFicha('${fid}',1)" aria-label="Descer">↓</button><button class="mini" onclick="editarFicha('${fid}')">Editar</button><button class="mini red" onclick="excluirFicha('${fid}')">Excluir</button></div></div>`}).join('')
   :`<p style="font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:12px">Este aluno está no programa padrão do nível ${esc(lv.nome)}. <a style="color:var(--red2);font-weight:700;cursor:pointer" onclick="go({type:'prog',n:'${esc(a.nivel)}'})">Ver programa</a></p>`;
  return`<div class="card" id="fichasCard">${lista}<div style="display:flex;gap:8px;${fs.length?'margin-top:12px':''}"><button class="btn" style="height:46px;font-size:14px" onclick="montarTreino('${id}')">${I.plus} Montar treino</button><button class="btn ghost" style="height:46px;font-size:14px" onclick="copiarDeSheet('${id}')">Copiar de…</button></div></div>`;
}
function histTreino(t){
  const ex=Array.isArray(t.exercicios)?t.exercicios:[],f=ex.filter(e=>e.feito).length,tid=esc(t.id);
  let r='';
  if(eP()){
    const a=aluno(t.aluno_id),wa=a&&waResp(a,t);
    if(S.respEd===t.id)r=`<div class="resp-f"><textarea id="rs-${tid}" maxlength="500" placeholder="Responda o feedback do aluno" oninput="document.getElementById('rc-${tid}').textContent=this.value.length+'/500'">${esc(t.resposta||'')}</textarea><div class="cnt" id="rc-${tid}">${String(t.resposta||'').length}/500</div><div class="resp-a"><button class="mini" id="rb-${tid}" onclick="salvarResposta('${tid}')">Enviar</button><button class="mini" onclick="S.respEd=null;rr()">Cancelar</button></div></div>`;
    else if(t.resposta)r=`<div class="resp"><b>Sua resposta${t.respondido_em?' · '+esc(fmtDC(t.respondido_em)):''}</b>${esc(t.resposta)}</div><div class="resp-a"><button class="mini" onclick="S.respEd='${tid}';rr()">Editar</button>${wa?`<a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>`;
    else r=`<div class="resp-a"><button class="mini" onclick="S.respEd='${tid}';rr()">Responder</button>${wa?`<a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>`;
  }else if(t.resposta)r=`<div class="resp"><b>Resposta do seu personal${t.respondido_em?' · '+esc(fmtDC(t.respondido_em)):''}</b>${esc(t.resposta)}</div>`;
  return`<div class="hist" id="h-${tid}"><div style="display:flex;justify-content:space-between"><b>${esc(t.treino||'Treino')}</b><span style="color:var(--mute)">${fmtD(t.data)}</span></div><small>${f} de ${ex.length} exercícios${t.feedback?' · '+esc(t.feedback):''}</small>${r}</div>`;
}
function waResp(a,t){
  let d=String(a.telefone||'').replace(/\D/g,'');if(!d)return null;if(d.length<=11)d='55'+d;
  return'https://wa.me/'+d+'?text='+encodeURIComponent(`Oi ${String(a.nome).trim().split(/\s+/)[0]}! Vi seu feedback do ${t.treino||'treino'} de ${fmtDC(t.data)}.${t.resposta?' '+t.resposta:''}`);
}
async function salvarResposta(id){
  const el=document.getElementById('rs-'+id);if(!el)return;const v=el.value.trim().slice(0,500);
  busy('rb-'+id,true,'Enviando…');
  try{const r=await Q(sb.from('apice_treinos_feitos').update({resposta:v||null}).eq('id',id).select().single());
    for(const k in S.trs){const t=S.trs[k].find(x=>x.id===id);if(t)Object.assign(t,r)}
    S.respEd=null;rr();toast(v?'Resposta enviada':'Resposta removida');if(v)avisar('apice_treinos_feitos',id)}
  catch(e){busy('rb-'+id,false,'Enviar');toast(traduzErro(e))}
}
const naoLidos=a=>trsDe(a.id).filter(t=>t.resposta&&t.lido_aluno===false);
async function verRespostas(){
  const a=S.alunos[0];if(!a)return;const l=naoLidos(a);
  l.forEach(t=>{t.lido_aluno=true});rr();
  const e=document.getElementById('ultTreinos');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});
  for(const t of l){try{await sb.from('apice_treinos_feitos').update({lido_aluno:true}).eq('id',t.id)}catch(_){}}
}
async function convidar(id){
  const a=aluno(id);busy('bt-conv',true,'Enviando…');
  try{
    const {data,error}=await sb.functions.invoke('apice-convidar',{body:{aluno_id:id,redirect_to:URL_APP}});
    if(error){let msg='';try{const j=await error.context.json();msg=j&&j.erro}catch(_){}throw msg?{message:msg,proprio:true}:error}
    if(data&&data.erro)throw {message:data.erro,proprio:true};
    const row=await Q(sb.from('apice_alunos').select('*').eq('id',id).single());
    Object.assign(a,row);
    const sit=data&&data.situacao;
    toast(sit==='ja_tem_acesso'?'Este aluno já tem acesso ao app':sit==='ligado_a_conta_existente'?'Aluno ligado à conta que ele já tinha':'Convite enviado por e-mail');
  }catch(e){toast(e&&e.proprio?e.message:traduzErro(e))}
  render();
}

/* ---- anamnese ---- */
const PARQ=['Algum médico já disse que você tem problema de coração e só deve fazer atividade física recomendada por médico?','Sente dor no peito quando faz atividade física?','No último mês, sentiu dor no peito sem estar fazendo atividade física?','Perde o equilíbrio por tontura ou já desmaiou?','Tem problema nos ossos ou articulações que pode piorar com exercício?','Toma remédio para pressão ou coração?','Sabe de algum outro motivo para não fazer atividade física?'];
const SN=[['sim','Sim'],['nao','Não']];
const OPC={gestante:SN,fuma:SN,treinou:SN,estresse:[['baixo','Baixo'],['medio','Médio'],['alto','Alto']],bebida:[['nunca','Nunca'],['as_vezes','Às vezes'],['frequente','Frequente']],
 doencas:[['hipertensao','Hipertensão'],['diabetes','Diabetes'],['asma','Asma'],['colesterol','Colesterol alto'],['tireoide','Problema de tireoide'],['outra','Outra']],
 dias:[['0','Seg'],['1','Ter'],['2','Qua'],['3','Qui'],['4','Sex'],['5','Sáb'],['6','Dom']],
 tempo:[['30','30 min'],['45','45 min'],['60','60 min'],['90','90 min']],
 objetivo:[['emagrecer','Emagrecer'],['massa','Ganhar massa'],['condicionamento','Condicionamento'],['saude','Saúde'],['performance','Performance'],['outro','Outro']]};
const ANMULTI={doencas:1,dias:1};
const anOk=()=>S.anam!=null;
const anLabel=(k,v)=>((OPC[k]||[]).find(x=>x[0]===String(v))||[0,v])[1];
function anAlerta(r){r=r||{};return (r.parq||[]).some(x=>x==='sim')||(r.doencas||[]).length>0||String(r.lesoes||'').trim()!==''||r.gestante==='sim'}
const anAlertaDe=id=>!!(S.anam&&S.anam[id]&&S.anam[id].alerta);
function anGet(k){const r=S.an.r;return /^q\d$/.test(k)?r.parq[+k[1]]:r[k]}
function anBtns(k){
  const q=/^q\d$/.test(k),op=q?SN:OPC[k],v=anGet(k);
  return op.map(([o,n])=>{const on=ANMULTI[k]?(v||[]).includes(o):v===o;return`<button type="button" class="${on?'on':''}${on&&q&&o==='sim'?' sim':''}" aria-pressed="${on}" onclick="${ANMULTI[k]?'anTog':'anSet'}('${k}','${o}')">${esc(n)}</button>`}).join('');
}
const anGrupo=(k,yn)=>`<div class="opts${yn?' yn':''}" id="an-g-${k}">${anBtns(k)}</div>`;
function anVis(){
  const r=S.an.r,o=$('an-outra'),p=$('an-parado');
  if(o)o.style.display=(r.doencas||[]).includes('outra')?'':'none';
  if(p)p.style.display=r.treinou==='sim'?'':'none';
}
function anRef(k){const e=$('an-g-'+k);if(e)e.innerHTML=anBtns(k);anVis()}
function anSet(k,v){if(!S.an)return;if(/^q\d$/.test(k))S.an.r.parq[+k[1]]=v;else S.an.r[k]=S.an.r[k]===v&&!/^q/.test(k)?null:v;anRef(k)}
function anTog(k,v){if(!S.an)return;const l=S.an.r[k]=S.an.r[k]||[],i=l.indexOf(v);if(i<0)l.push(v);else l.splice(i,1);anRef(k)}
function anamSheet(alunoId){
  const a=aluno(alunoId);if(!a)return;
  const row=S.anam&&S.anam[alunoId],base=JSON.parse(JSON.stringify((row&&row.respostas)||{}));
  const r=Object.assign({},base,{parq:[0,1,2,3,4,5,6].map(i=>(base.parq||[])[i]||null),doencas:base.doencas||[],dias:base.dias||[]});
  S.an={alunoId,r};
  const fem=a.sexo!=='masculino',t=(id,l,v,ph)=>`<div class="fld"><label>${l}</label><textarea id="${id}" maxlength="500" placeholder="${ph||''}">${esc(v||'')}</textarea></div>`;
  const num=(id,l,v,ph)=>`<div class="fld"><label>${l}</label><input id="${id}" inputmode="decimal" maxlength="5" placeholder="${ph||''}" value="${esc(v==null?'':String(v).replace('.',','))}"></div>`;
  const grp=(l,k,yn)=>`<div class="fld"><label>${l}</label>${anGrupo(k,yn)}</div>`;
  openSheet(`<h4>Anamnese${eP()?' de '+esc(a.nome):''}</h4>
  <p class="note" style="margin-bottom:6px">${eP()?'Você está preenchendo pelo aluno. ':''}Leva uns 2 minutos. Só as 7 perguntas de saúde são obrigatórias, o resto é opcional.${row&&row.atualizado?' <b>Atualizada em '+esc(fmtDC(row.atualizado))+'</b>':''}</p>
  <div class="lbl" style="margin-top:14px">Saúde do coração e do corpo (obrigatório)</div>
  <div id="an-parq">${PARQ.map((q,i)=>`<div class="pq"><p>${i+1}) ${esc(q)}</p>${anGrupo('q'+i,true)}</div>`).join('')}</div>
  <div class="lbl">Saúde</div>

/* ---- plano do aluno: fichas do personal ou programa padrão do nível ---- */
const REST_S={base:60,forte:90,palco:120};
function parsePres(t){
  t=String(t||'');const m=t.match(/^\s*(\d+)\s*[×x]\s*(\d+)(?:\s*[–-]\s*\d+)?\s*(s\b)?/i);
  if(!m)return{n:3,alvo:'',seg:false};
  const n=Math.min(10,Math.max(1,Number(m[1])||3));return{n,alvo:m[2],seg:!!m[3]};
}
function fmtKg(v){return String(Math.round(v*100)/100).replace('.',',')+' kg'}
function cargaN(x){const n=pnum(String(x==null?'':x).replace(/kg/i,''));return n!=null&&isFinite(n)&&n>0?n:null}
const maxCarga=l=>{let m=null;l.forEach(x=>{const n=cargaN(x.carga);if(n!=null&&(m==null||n>m))m=n});return m};
function cargasFeitas(e){/* números das séries feitas; treino antigo (sem series) = carga única */
  if(Array.isArray(e.series))return e.series.filter(x=>x.feito).map(x=>cargaN(x.carga)).filter(n=>n!=null);
  const n=e.feito?cargaN(e.carga):null;return n!=null?[n]:[];
}
const nivelAluno=()=>S.alunos[0]&&LV[S.alunos[0].nivel]?S.alunos[0].nivel:'base';
function itemProg(k,nivel){const pres=EX[k].pres[nivel],pr=parsePres(pres);return{id:k,k,pres,n:pr.n,alvo:pr.alvo,seg:pr.seg,carga:'',descanso:REST_S[nivel]||60,obs:''}}
function itemFicha(x,usados,nivel){
  const k=String(x.chave||''),c=usados[k]=(usados[k]||0)+1,n=Math.min(12,Math.max(1,Math.round(Number(x.series))||3)),reps=String(x.reps==null?'':x.reps).trim();
  return{id:c>1?k+'#'+c:k,k,pres:n+' × '+(reps||'—'),n,alvo:(reps.match(/\d+/)||[''])[0],seg:/\d\s*(s|seg|segundos?)\b/i.test(reps),carga:x.carga||'',descanso:Number(x.descanso)>0?Number(x.descanso):(REST_S[nivel]||60),obs:x.obs||''};
}
function plano(){
  const a=S.alunos[0],nivel=nivelAluno(),fs=a?fichasDe(a.id):[];
  if(fs.length)return{ficha:true,tempo:'',dias:fs.map(f=>{const u={};return{n:f.nome,f:f.foco||'',obs:f.obs||'',ex:exs(f).map(x=>itemFicha(x,u,nivel))}})};
  return{ficha:false,tempo:PROG[nivel].tempo,dias:PROG[nivel].dias.map(d=>({n:d.n,f:d.f,obs:'',ex:d.ex.map(k=>itemProg(k,nivel))}))};
}
function diaAtual(){const pl=plano();return pl.dias[S.dia]||pl.dias[0]||{n:'Treino',f:'',obs:'',ex:[]}}
const itemById=id=>diaAtual().ex.find(x=>x.id===id);
function ensureSer(id){
  const it=itemById(id),f=S.feitos[id]||(S.feitos[id]={});
  if(Array.isArray(f.series)&&f.series.length)return f;
  const a=S.alunos[0],ult=trsDe(a.id).map(t=>(t.exercicios||[]).find(x=>x.chave===it.k&&x.feito)).filter(Boolean)[0];
  const uc=ult&&Array.isArray(ult.series)&&ult.series.some(x=>cargaN(x.carga)!=null)?ult.series:null;
  const fc=cargaN(it.carga),fcs=fc!=null?String(fc).replace('.',','):'';
  const ant=i=>{
    if(uc){const l=uc.filter(x=>cargaN(x.carga)!=null);const x=uc[i]&&cargaN(uc[i].carga)!=null?uc[i]:l[l.length-1];return x?String(cargaN(x.carga)).replace('.',','):fcs}
    const n=ult?cargaN(ult.carga):null;return n!=null?String(n).replace('.',','):fcs;
  };
  f.series=Array.from({length:it.n},(_,i)=>({reps:'',carga:'',pr:it.alvo,pc:ant(i),feito:!!f.feito}));
  if(f.feito&&f.carga){const n=cargaN(f.carga);if(n!=null)f.series.forEach(x=>x.carga=String(n).replace('.',','))}
  if(f.feito)f.series.forEach(fillSer);
  return f;
}
function fillSer(x){if(x.reps===''||x.reps==null)x.reps=x.pr||'';if(x.carga===''||x.carga==null)x.carga=x.pc||''}
function rr(){const y=window.scrollY;render();window.scrollTo(0,y)}
function abrirEx(k){S.aberto=S.aberto===k?null:k;rr()}
function setSer(k,i,c,v){const f=S.feitos[k];if(f&&f.series&&f.series[i])f.series[i][c]=v}
function toggleEx(k){
  const f=ensureSer(k);

}
function serieOk(k,i){

const agora=()=>Date.now()+(window.__dtOff||0);
const REST={fim:null};
let AC=null;
function audioUnlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!AC)AC=new C();if(AC.state==='suspended')AC.resume()}catch(_){}}
function bipe(){
  try{if(!AC)return;const t=AC.currentTime;[0,.22].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.2)})}catch(_){}
}
function startRest(sec){REST.fim=agora()+sec*1000;REST.tot=sec*1000;tickRest()}
function restAdd(s){if(REST.fim==null)return;REST.fim+=s*1000;REST.tot=Math.max(REST.tot||0,REST.fim-agora());tickRest()}

function tickRest(){
  const el=$('rest');if(!el)return;
  if(REST.fim==null||S.screen!=='app'){el.classList.remove('on');document.body.classList.remove('resting');return}

  document.body.classList.add('resting');const s=Math.ceil(ms/1000),tx=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('rest-t').textContent='Descanso '+tx;el.classList.add('on');
  const rb=$('rest-big');if(rb)rb.textContent=tx;const bar=$('rest-bar');if(bar&&REST.tot)bar.style.width=Math.max(0,Math.min(100,ms/REST.tot*100))+'%';
}
setInterval(()=>{tickRest();const e=$('tm-el');if(e&&S.tIni){const t=Math.floor((Date.now()-S.tIni)/1000);e.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}},250);

function feedbackSheet(){
  S.feel='ok';
  openSheet(`<h4>Como foi o treino?</h4><div class="feel" id="feel">${[['facil','Fácil'],['ok','Ok'],['pesado','Pesado']].map(([k,n])=>`<button class="${k==='ok'?'on':''}" onclick="setFeel('${k}')">${n}</button>`).join('')}</div>

function setFeel(k){S.feel=k;[...document.querySelectorAll('#feel button')].forEach((b,i)=>b.classList.toggle('on',['facil','ok','pesado'][i]===k))}
function resumoTreino(row,ant){
  let ser=0,vol=0;const prs=[];
  row.exercicios.forEach(e=>{const fs=(e.series||[]).filter(x=>x.feito);ser+=fs.length;fs.forEach(x=>{if(x.reps&&x.carga)vol+=x.reps*x.carga});

    for(const t of ant){const q=(t.exercicios||[]).find(y=>y.chave===e.chave&&y.feito);if(q){const c=cargasFeitas(q);if(c.length){pm=Math.max(...c);break}}}
    if(pm!=null&&mx>pm)prs.push({n:exInfo(e.chave).nome,de:pm,para:mx});

async function salvarAluno(id){
  const nome=val('al-nome').trim();if(!nome){msg('Digite o nome do aluno.');return}
  const email=val('al-email').trim();if(email&&!/^\S+@\S+\.\S+$/.test(email)){msg('E-mail inválido.');return}
  let alt=pnum(val('al-alt'));if(alt!=null&&alt>3)alt=alt/100;
  const meta=pnum(val('al-meta'));
  if(Number.isNaN(alt)||(alt!=null&&(alt<0.5||alt>2.5))){msg('Altura inválida. Use metros, por exemplo 1,75.');return}
  if(Number.isNaN(meta)||(meta!=null&&(meta<20||meta>400))){msg('Meta de peso inválida.');return}
  const mens=pnum(val('al-mens').trim().replace(/\.(?=\d{3}(\D|$))/g,'')),vencS=val('al-venc').trim(),venc=vencS===''?null:Number(vencS);
  if(Number.isNaN(mens)||(mens!=null&&(mens<=0||mens>99999))){msg('Mensalidade inválida. Exemplo: 150,00.');return}
  if(venc!=null&&(!Number.isInteger(venc)||venc<1||venc>31)){msg('Dia do vencimento: de 1 a 31.');return}
  if((mens==null)!==(venc==null)){msg('Para cobrar a mensalidade, preencha o valor e o dia do vencimento.');return}
  const row={mensalidade:mens,vencimento_dia:venc,nome,email:email||null,telefone:val('al-tel').trim()||null,nascimento:val('al-nasc')||null,altura:alt,sexo:val('al-sexo')||null,nivel:val('al-nivel'),objetivo:val('al-obj').trim()||null,meta_peso:meta,nota:val('al-nota').trim()||null};
  msg('');busy('bt-al',true,'Salvando…');
  try{
    if(id){const r=await Q(sb.from('apice_alunos').update(row).eq('id',id).select().single());Object.assign(aluno(id),r);closeSheet();render();toast('Aluno atualizado');avisar('apice_alunos',id)}
    else{row.personal_id=S.user.id;row.ativo=true;const r=await Q(sb.from('apice_alunos').insert(row).select().single());
      S.alunos.push(r);S.alunos.sort((x,y)=>String(x.nome).localeCompare(String(y.nome),'pt-BR'));S.regs[r.id]=[];S.trs[r.id]=[];
      closeSheet();S.tab='alunos';S.stack=[{type:'aluno',id:r.id}];render();toast('Aluno cadastrado')}
  }catch(e){busy('bt-al',false);msg(traduzErro(e))}
}
function excluirAluno(id){
  const a=aluno(id);
  confirmar('Excluir aluno?',`${a.nome} e todo o histórico de avaliações e treinos dele serão apagados. Isso não pode ser desfeito.`,'Sim, excluir aluno',async()=>{
    const {error}=await sb.from('apice_alunos').delete().eq('id',id);if(error)throw error;
    S.alunos=S.alunos.filter(x=>x.id!==id);delete S.regs[id];delete S.trs[id];S.stack=[];closeSheet();render();toast('Aluno excluído');
  });
}

async function salvarAval(alunoId,regId){
  const data=val('av-data');if(!data){msg('Informe a data.');return}
  const peso=pnum(val('av-peso')),gord=pnum(val('av-gord'));const med={};let bad=false;
  for(const k of ['cintura','quadril','braco','coxa','peito']){const v=pnum(val('av-'+k));if(Number.isNaN(v)||(v!=null&&(v<=0||v>300)))bad=true;else if(v!=null)med[k]=v}
  if(bad||Number.isNaN(peso)||Number.isNaN(gord)){msg('Confira os números digitados.');return}
  if(peso!=null&&(peso<20||peso>400)){msg('Peso fora do esperado (20 a 400 kg).');return}
  if(gord!=null&&(gord<1||gord>70)){msg('% de gordura fora do esperado (1 a 70).');return}
  if(peso==null&&gord==null&&!Object.keys(med).length){msg('Preencha ao menos o peso, a gordura ou uma medida.');return}
  const row={aluno_id:alunoId,data,peso,gordura:gord,medidas:Object.keys(med).length?med:null,obs:val('av-obs').trim()||null};
  msg('');busy('bt-av',true,'Salvando…');
  try{let rid=regId;
    if(regId){const r=await Q(sb.from('apice_registros').update(row).eq('id',regId).select().single());const l=S.regs[alunoId];l[l.findIndex(x=>x.id===regId)]=r}
    else{row.criado_por=S.user.id;const r=await Q(sb.from('apice_registros').insert(row).select().single());rid=r.id;(S.regs[alunoId]=S.regs[alunoId]||[]).push(r)}
    sortRegs(alunoId);closeSheet();render();toast('Avaliação salva');avisar('apice_registros',rid,{editado:!!regId})
  }catch(e){busy('bt-av',false);msg(traduzErro(e))}
}

/* ================= FOTOS DE EVOLUÇÃO ================= */
const ANG=[['frente','Frente'],['lado','Lado'],['costas','Costas']];
const FOTO_BUCKET='apice-fotos';
Object.assign(S,{fotos:{},fu:{},fCarr:{},ft:null,fc:null});
const fotosDe=id=>S.fotos[id]||[];
const fotoUrl=c=>{const u=S.fu[c];return u&&u.exp>Date.now()?u.url:''};
async function fotosUrls(rows){
  const falta=rows.map(r=>r.caminho).filter(c=>!fotoUrl(c));
  if(!falta.length)return;
  try{const {data,error}=await sb.storage.from(FOTO_BUCKET).createSignedUrls(falta,3600);if(error)throw error;
    (data||[]).forEach(x=>{if(x&&x.signedUrl)S.fu[x.path]={url:x.signedUrl,exp:Date.now()+55*60*1000}})}catch(_){}
}
function fotosPintar(id){const e=$('fotosCard');if(e&&e.dataset.aluno===id)e.innerHTML=fotosInner(aluno(id))}
async function fotosCarregar(id,recarga){
  if(S.fCarr[id])return;S.fCarr[id]=true;
  try{
    if(recarga||S.fotos[id]===undefined)S.fotos[id]=await Q(sb.from('apice_fotos').select('*').eq('aluno_id',id).order('data',{ascending:false}))||[];
    await fotosUrls(S.fotos[id]);
  }catch(e){if(S.fotos[id]===undefined)S.fotos[id]=[]}
  finally{S.fCarr[id]=false}
  fotosPintar(id);
}
function fotosGrupos(id){
  const g={};fotosDe(id).forEach(f=>{const d=String(f.data).slice(0,10);(g[d]=g[d]||{})[f.angulo]=f});
  return Object.keys(g).sort().reverse().map(d=>[d,g[d]]);
}
function fotosInner(a){
  const id=a.id;
  if(S.fotos[id]===undefined){setTimeout(()=>fotosCarregar(id),0);return'<p style="font-size:13px;color:var(--mute)">Carregando fotos…</p>'}
  const gr=fotosGrupos(id);
  if(fotosDe(id).some(f=>!fotoUrl(f.caminho))&&!S.fCarr[id])setTimeout(()=>fotosCarregar(id),0);
  const lista=gr.length?gr.map(([d,m])=>`<div style="margin-top:12px"><b style="font-size:13px">${fmtD(d)}</b>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px">${ANG.map(([k,n])=>{const f=m[k];
      return f?`<button type="button" class="fth" data-foto="${esc(f.id)}" onclick="fotoVer('${esc(f.id)}')" style="padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--s2);aspect-ratio:3/4;position:relative">${fotoUrl(f.caminho)?`<img src="${esc(fotoUrl(f.caminho))}" alt="${esc(n)}" style="width:100%;height:100%;object-fit:cover;display:block">`:''}<span style="position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;background:#000a;color:#fff;padding:2px 0">${n}</span></button>`
      :`<div style="border:1px dashed var(--line);border-radius:12px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)">${n}</div>`}).join('')}</div></div>`).join('')
    :'<p style="font-size:13px;color:var(--mute)">Nenhuma foto ainda. Frente, lado e costas mostram a evolução que a balança não mostra.</p>';
  return`<div style="display:flex;gap:8px"><button class="btn" style="height:44px;font-size:14px" onclick="fotosSheet('${esc(id)}')">${I.plus} Adicionar fotos</button>${gr.length>1?`<button class="btn ghost" style="height:44px;font-size:14px" onclick="fotosComparar('${esc(id)}')">Comparar</button>`:''}</div>${lista}`;
}
const fotosCard=a=>`<div class="lbl">Fotos de evolução</div><div class="card" id="fotosCard" data-aluno="${esc(a.id)}">${fotosInner(a)}</div>`;
function fotosSheet(alunoId,regId,data){
  S.ft={alunoId,regId:regId||null,blobs:{}};
  openSheet(`<h4>Fotos de evolução</h4>
  ${inp('ft-data','Data',data||hoje(),'type="date"')}
  ${ANG.map(([k,n])=>`<div class="fld"><label>${n}</label><div id="ft-pv-${k}" style="display:none;margin-bottom:6px"></div>
   <input id="ft-in-${k}" type="file" accept="image/*" capture="environment" style="font-size:16px;height:auto;padding:10px 12px" onchange="fotoEscolhida('${k}',this)"></div>`).join('')}
  <p style="font-size:12px;color:var(--mute);margin-bottom:10px">Pode enviar só as que tiver. As fotos ficam privadas: só você e ${eP()?'o aluno':'seu personal'} veem.</p>
  <div class="msg" id="msg"></div>
  <button class="btn" id="bt-ft" onclick="fotosSalvar()">Enviar fotos</button>`);

async function fotoComprimir(file){
  let bmp=null,url=null,w,h,src;
  try{
    if(window.createImageBitmap){try{bmp=await Promise.race([createImageBitmap(file),new Promise(r=>setTimeout(()=>r(null),3000))])}catch(_){bmp=null}}
    if(bmp){src=bmp;w=bmp.width;h=bmp.height}
    else{url=URL.createObjectURL(file);const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(new Error('dec'));im.src=url});src=im;w=im.naturalWidth;h=im.naturalHeight}
    if(!w||!h)throw new Error('dec');
    const k=Math.min(1,1280/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
    if(!blob)throw new Error('dec');
    return blob;
  }catch(e){throw {message:'Não foi possível ler esta foto. Tente outra no formato JPEG ou PNG.'}}
  finally{if(url)URL.revokeObjectURL(url);if(bmp&&bmp.close)bmp.close()}
}
async function fotoEscolhida(k,inpEl){
  const f=inpEl.files&&inpEl.files[0];if(!f||!S.ft)return;
  const pv=$('ft-pv-'+k);msg('');
  try{const b=await fotoComprimir(f);S.ft.blobs[k]=b;
    pv.style.display='block';pv.innerHTML=`<img alt="Prévia ${esc(k)}" src="${URL.createObjectURL(b)}" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:block">`}
  catch(e){delete S.ft.blobs[k];inpEl.value='';pv.style.display='none';msg(traduzErro(e))}
}
async function fotosSalvar(){
  const ft=S.ft;if(!ft)return;const data=val('ft-data');
  if(!data){msg('Informe a data.');return}
  const ks=ANG.map(x=>x[0]).filter(k=>ft.blobs[k]);
  if(!ks.length){msg('Escolha ao menos uma foto.');return}
  msg('');busy('bt-ft',true,'Enviando…');
  let ok=0,falhou=false;
  for(const k of ks){
    const caminho=`${ft.alunoId}/${data}-${k}-${Date.now()}.jpg`;
    try{
      const up=await sb.storage.from(FOTO_BUCKET).upload(caminho,ft.blobs[k],{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;
      const ins=await sb.from('apice_fotos').insert({aluno_id:ft.alunoId,registro_id:ft.regId,data,angulo:k,caminho}).select().single();
      if(ins.error){try{await sb.storage.from(FOTO_BUCKET).remove([caminho])}catch(_){}throw ins.error}
      (S.fotos[ft.alunoId]=S.fotos[ft.alunoId]||[]).push(ins.data);ok++;
    }catch(e){falhou=true;msg(traduzErro(e));}
  }
  if(ok){await fotosUrls(fotosDe(ft.alunoId))}
  if(falhou){busy('bt-ft',false);if(ok){fotosPintar(ft.alunoId);toast(ok+' enviada(s). Tente de novo as outras.')}return}
  S.ft=null;closeSheet();rr();toast(ok===1?'Foto enviada':ok+' fotos enviadas');
}
function fotoVer(fid){
  let f=null,aid=null;Object.keys(S.fotos).forEach(k=>{const x=S.fotos[k].find(y=>y.id===fid);if(x){f=x;aid=k}});if(!f)return;
  const n=(ANG.find(x=>x[0]===f.angulo)||[0,f.angulo])[1];
  openSheet(`<h4>${esc(n)} · ${fmtD(f.data)}</h4>
  <img id="foto-grande" alt="${esc(n)}" src="${esc(fotoUrl(f.caminho))}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:var(--s2);display:block;margin-bottom:12px">
  <button class="btn danger" onclick="fotoApagar('${esc(fid)}')">Apagar foto</button>
  <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Fechar</button>`);
}
function fotoApagar(fid){
  let f=null,aid=null;Object.keys(S.fotos).forEach(k=>{const x=S.fotos[k].find(y=>y.id===fid);if(x){f=x;aid=k}});if(!f)return;
  confirmar('Apagar foto?',`A foto (${f.angulo}) de ${fmtD(f.data)} será removida definitivamente.`,'Sim, apagar',async()=>{
    const r1=await sb.storage.from(FOTO_BUCKET).remove([f.caminho]);if(r1.error)throw r1.error;
    const r2=await sb.from('apice_fotos').delete().eq('id',fid);if(r2.error)throw r2.error;
    S.fotos[aid]=S.fotos[aid].filter(x=>x.id!==fid);delete S.fu[f.caminho];closeSheet();rr();toast('Foto apagada');
  });
}

  S.fc={id,d1:ds[ds.length-1],d2:ds[0],ang:'frente'};fotosCompHTML();

function fotosCompHTML(){
  const c=S.fc,gr=fotosGrupos(c.id),ds=gr.map(x=>x[0]);
  const op=v=>ds.map(d=>`<option value="${esc(d)}"${d===v?' selected':''}>${fmtD(d)}</option>`).join('');

  openSheet(`<h4>Comparar fotos</h4>
  <div class="chips" style="margin:0 0 10px">${ANG.map(([k,n])=>`<button class="${c.ang===k?'on':''}" onclick="S.fc.ang='${k}';fotosCompHTML()">${n}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px">
   <div class="fld" style="margin:0"><label>Antes</label><select id="fc-d1" onchange="S.fc.d1=this.value;fotosCompHTML()">${op(c.d1)}</select></div>
   <div class="fld" style="margin:0"><label>Depois</label><select id="fc-d2" onchange="S.fc.d2=this.value;fotosCompHTML()">${op(c.d2)}</select></div></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px">${cel(c.d1,'Antes')}${cel(c.d2,'Depois')}</div>
  <button class="btn ghost" onclick="closeSheet()">Fechar</button>`);
}

/* ================= MONTADOR DE TREINO ================= */
const DESCANSOS=[30,45,60,90,120,180];
const nomeAluno=id=>{const a=aluno(id);return a?a.nome:'aluno'};
function montarTreino(alunoId){
  const n=fichasDe(alunoId).length;
  S.ed={id:null,aluno_id:alunoId,nome:'Treino '+letra(n),foco:'',obs:'',ex:[]};edRender();
}
function novoModelo(){S.ed={id:null,aluno_id:null,nome:'Modelo '+(modelos().length+1),foco:'',obs:'',ex:[]};edRender()}
function editarFicha(id){
  const f=S.fichas.find(x=>x.id===id);if(!f)return;
  S.ed={id:f.id,aluno_id:f.aluno_id||null,nome:f.nome||'',foco:f.foco||'',obs:f.obs||'',
    ex:exs(f).map(x=>({chave:x.chave,series:Math.min(10,Math.max(1,Math.round(Number(x.series))||3)),reps:String(x.reps==null?'':x.reps),carga:x.carga||'',descanso:Number(x.descanso)>0?Number(x.descanso):null,obs:x.obs||''}))};
  edRender();
}
function edRender(){
  const sh=document.querySelector('.sheet'),y=sh&&$('sheet').classList.contains('on')?sh.scrollTop:0;
  openSheet(edHTML());
  if(y)document.querySelector('.sheet').scrollTop=y;
}
function edHTML(){
  const ed=S.ed,al=ed.aluno_id?aluno(ed.aluno_id):null,nivel=al&&LV[al.nivel]?al.nivel:null;
  const padrao=nivel?`Padrão do nível (${REST_S[nivel]} s)`:'Padrão do nível';
  const itens=ed.ex.map((x,i)=>{const inf=exInfo(x.chave),n=ed.ex.length;
    return`<div class="edx"><div class="edx-h"><div class="thumb">${exThumb(x.chave)}</div>
     <div class="t" onclick="edTroca(${i})"><b>${esc(inf.nome)}</b><small>${esc(inf.grupo||'Sem grupo')} · toque para trocar</small></div>
     <div class="edx-b"><button class="mini" ${i?'':'disabled'} onclick="edMove(${i},-1)" aria-label="Subir">↑</button><button class="mini" ${i<n-1?'':'disabled'} onclick="edMove(${i},1)" aria-label="Descer">↓</button><button class="mini red" onclick="edDel(${i})" aria-label="Remover">✕</button></div></div>
     <div class="edx-g">
      <div class="fld"><label>Séries</label><div class="stp"><button onclick="edSer(${i},-1)" aria-label="Menos uma série">−</button><b>${x.series}</b><button onclick="edSer(${i},1)" aria-label="Mais uma série">+</button></div></div>
      <div class="fld"><label>Repetições</label><input value="${esc(x.reps)}" maxlength="20" placeholder="12 ou 8–10 ou 30 s" oninput="S.ed.ex[${i}].reps=this.value"></div>
      <div class="fld"><label>Carga (opcional)</label><input value="${esc(x.carga)}" maxlength="20" placeholder="Ex.: 20 kg" oninput="S.ed.ex[${i}].carga=this.value"></div>
      <div class="fld"><label>Descanso</label><select onchange="S.ed.ex[${i}].descanso=this.value?Number(this.value):null"><option value="">${esc(padrao)}</option>${(x.descanso&&!DESCANSOS.includes(x.descanso)?DESCANSOS.concat([x.descanso]).sort((p,q)=>p-q):DESCANSOS).map(d=>`<option value="${d}" ${x.descanso===d?'selected':''}>${d} s</option>`).join('')}</select></div>
     </div>
     <div class="fld edx-o"><label>Observação (opcional)</label><input value="${esc(x.obs)}" maxlength="150" placeholder="Ex.: descida lenta, 3 segundos" oninput="S.ed.ex[${i}].obs=this.value"></div></div>`}).join('');
  return`<h4>${ed.id?'Editar':'Montar'} ${ed.aluno_id?'treino':'modelo'}${al?' · '+primeiro(al.nome):''}</h4>
  <div class="fld"><label>Nome *</label><input id="ed-nome" maxlength="40" value="${esc(ed.nome)}" placeholder="Treino A" autocomplete="off" oninput="S.ed.nome=this.value"></div>
  <div class="fld"><label>Foco</label><input id="ed-foco" maxlength="60" value="${esc(ed.foco)}" placeholder="Ex.: Peito, ombro e tríceps" autocomplete="off" oninput="S.ed.foco=this.value"></div>
  <div class="fld"><label>Observação geral (o aluno vê)</label><textarea id="ed-obs" maxlength="500" style="min-height:64px" placeholder="Ex.: aqueça 10 minutos antes" oninput="S.ed.obs=this.value">${esc(ed.obs)}</textarea></div>
  <div class="lbl" style="margin:6px 0 10px">Exercícios (${ed.ex.length})</div>
  ${itens||'<p style="font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:12px">Nenhum exercício ainda. Toque em Adicionar exercício.</p>'}
  <button class="btn ghost" style="margin-bottom:14px" onclick="edAdd()">${I.plus} Adicionar exercício</button>
  <div class="msg" id="msg"></div>
  <button class="btn" id="bt-ed" onclick="salvarFicha(false)">Salvar</button>
  ${ed.aluno_id?`<button class="btn ghost" id="bt-ed2" style="margin-top:8px" onclick="salvarFicha(true)">Salvar também como modelo</button>`:''}
  <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`;
}
function edMove(i,d){const l=S.ed.ex,j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];edRender()}
function edDel(i){S.ed.ex.splice(i,1);edRender()}
function edSer(i,d){const x=S.ed.ex[i];x.series=Math.min(10,Math.max(1,x.series+d));edRender()}
/* seletor de exercício */
function edAdd(){
  if(S.ed.ex.length>=30){toast('Máximo de 30 exercícios por treino.');return}
  S.sel={mode:'add',i:-1,q:'',g:''};selRender();
}
function edTroca(i){S.sel={mode:'troca',i,q:'',g:''};selRender()}
function selChaves(){
  const q=norm(S.sel.q).trim(),g=S.sel.g;
  return Object.keys(EX).concat(S.exps.map(p=>'p:'+p.id)).filter(k=>{const i=exInfo(k);
    return(!g||i.grupo===g)&&(!q||norm(i.nome).includes(q)||norm(i.grupo).includes(q)||norm(i.equip).includes(q))})
    .sort((a,b)=>exInfo(a).nome.localeCompare(exInfo(b).nome,'pt-BR'));
}
function selGrupos(){const s=new Set();Object.keys(EX).concat(S.exps.map(p=>'p:'+p.id)).forEach(k=>{const g=exInfo(k).grupo;if(g)s.add(g)});return[...s].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function selListaHTML(){
  const l=selChaves();
  if(!l.length)return'<p style="font-size:13px;color:var(--mute);padding:14px 0">Nenhum exercício encontrado. Você pode criar o seu abaixo.</p>';
  return l.map(k=>{const i=exInfo(k);return`<div class="row ex-row" onclick="selPick('${esc(k)}')"><div class="thumb">${exThumb(k)}</div><div class="t"><b>${esc(i.nome)}</b><small>${esc(i.grupo)}${i.equip?' · '+esc(i.equip):''}${i.proprio?' · seu exercício':''}</small></div><span style="color:var(--red);display:grid">${I.plus}</span></div>`}).join('');
}
function selLista(){const e=$('sel-lista');if(e)e.innerHTML=selListaHTML()}
function selRender(){
  const sh=document.querySelector('.sheet');
  openSheet(`<h4>${S.sel.mode==='troca'?'Trocar exercício':'Adicionar exercício'}</h4>
  <label class="search">${I.search}<input id="sel-q" placeholder="Buscar exercício" value="${esc(S.sel.q)}" autocomplete="off" oninput="S.sel.q=this.value;selLista()"></label>
  <div class="chips"><button class="${S.sel.g?'':'on'}" onclick="S.sel.g='';selRender()">Todos</button>${selGrupos().map(g=>`<button class="${S.sel.g===g?'on':''}" onclick="S.sel.g=this.dataset.g;selRender()" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>
  <div class="card" style="padding:0 14px;margin-bottom:12px" id="sel-lista">${selListaHTML()}</div>
  <button class="btn ghost" onclick="crSheet('sel')">${I.plus} Criar exercício</button>
  <button class="btn ghost" style="margin-top:8px" onclick="edRender()">Voltar</button>`);
  if(sh)document.querySelector('.sheet').scrollTop=0;
}
function selPick(chave){
  const s=S.sel;if(!s||!S.ed)return;
  if(s.mode==='troca'&&S.ed.ex[s.i])S.ed.ex[s.i].chave=chave;
  else{if(S.ed.ex.length>=30){toast('Máximo de 30 exercícios por treino.');return}S.ed.ex.push({chave,series:3,reps:'12',carga:'',descanso:null,obs:''})}
  edRender();
  if(s.mode!=='troca'){const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=sh.scrollHeight}
  S.sel=null;
}
/* criar / editar exercício próprio */
function crSheet(from,id){
  const p=id?S.exps.find(x=>x.id===id):null;
  S.cr={id:id||null,from,nome:p?p.nome:'',grupo:p?(p.grupo||'Outro'):'Pernas',musculos:p&&Array.isArray(p.musculos)?p.musculos.filter(m=>NOMEM[m]):[],equip:p?(p.equip||''):'',obs:p?(p.obs||''):'',video:p?(p.video_url||''):''};
  const c=S.cr;
  openSheet(`<h4>${id?'Editar exercício':'Criar exercício'}</h4>
  <div class="fld"><label>Nome *</label><input id="cr-nome" maxlength="60" value="${esc(c.nome)}" placeholder="Ex.: Cadeira extensora" autocomplete="off" oninput="S.cr.nome=this.value"></div>
  <div class="g3"><div class="fld"><label>Grupo</label><select id="cr-grupo" onchange="S.cr.grupo=this.value">${GRUPOS.map(g=>`<option ${c.grupo===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
   <div class="fld"><label>Equipamento</label><input id="cr-equip" maxlength="40" value="${esc(c.equip)}" placeholder="Ex.: Máquina" autocomplete="off" oninput="S.cr.equip=this.value"></div></div>
  <div class="fld"><label>Músculos trabalhados (toque para marcar)</label>
   <div style="display:flex;gap:12px;align-items:flex-start"><div id="cr-chips" style="flex:1;display:flex;flex-wrap:wrap;gap:6px">${crChips()}</div><div id="cr-map" style="width:22%;flex:none">${bodyMap('f',c.musculos,[])}</div></div></div>
  <div class="fld"><label>Observação (opcional)</label><textarea id="cr-obs" maxlength="300" style="min-height:64px" placeholder="Como fazer, ajustes da máquina…" oninput="S.cr.obs=this.value">${esc(c.obs)}</textarea></div>
  <div class="fld"><label>Link de vídeo (opcional)</label><input id="cr-video" maxlength="300" inputmode="url" autocapitalize="off" value="${esc(c.video)}" placeholder="https://" autocomplete="off" oninput="S.cr.video=this.value"></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="bt-cr" onclick="crSalvar()">${id?'Salvar exercício':'Criar exercício'}</button>
  <button class="btn ghost" style="margin-top:8px" onclick="crVoltar()">Cancelar</button>`);
}
const crChips=()=>Object.keys(NOMEM).map(m=>`<button type="button" class="badge" style="padding:8px 12px;font-size:12px;border:1px solid var(--line);background:${S.cr.musculos.includes(m)?'var(--red)':'var(--s2)'};color:${S.cr.musculos.includes(m)?'#fff':'var(--mute)'}" onclick="crMus('${m}')">${esc(NOMEM[m])}</button>`).join('');
function crMus(m){const l=S.cr.musculos,i=l.indexOf(m);if(i<0)l.push(m);else l.splice(i,1);$('cr-chips').innerHTML=crChips();$('cr-map').innerHTML=bodyMap('f',l,[])}
function crVoltar(){if(S.cr&&S.cr.from==='sel'&&S.ed)selRender();else closeSheet()}
async function crSalvar(){
  const c=S.cr,nome=c.nome.trim(),video=c.video.trim();
  if(!nome){msg('Dê um nome ao exercício.');return}
  if(video&&(!/^https:\/\/\S+$/i.test(video)||video.length>300)){msg('O link do vídeo precisa começar com https://');return}
  const row={nome,grupo:c.grupo||'Outro',musculos:c.musculos.slice(),equip:c.equip.trim()||null,obs:c.obs.trim()||null,video_url:video||null};
  msg('');busy('bt-cr',true,'Salvando…');
  try{
    let r;
    if(c.id){r=await Q(sb.from('apice_exercicios').update(row).eq('id',c.id).select().single());const i=S.exps.findIndex(x=>x.id===c.id);if(i>=0)S.exps[i]=r}
    else{row.personal_id=S.user.id;r=await Q(sb.from('apice_exercicios').insert(row).select().single());S.exps.push(r)}
    if(c.from==='sel'&&S.ed&&!c.id){S.sel={mode:'add',i:-1,q:'',g:''};selPick('p:'+r.id);toast('Exercício criado e adicionado')}
    else if(c.from==='sel'&&S.ed){selRender();toast('Exercício salvo')}
    else{closeSheet();render();toast(c.id?'Exercício salvo':'Exercício criado')}
  }catch(e){busy('bt-cr',false);msg(traduzErro(e))}
}
function excluirExProprio(id){
  const p=S.exps.find(x=>x.id===id);if(!p)return;
  confirmar('Excluir exercício?',`"${p.nome}" será apagado. Treinos que usam este exercício vão mostrar "Exercício removido".`,'Sim, excluir',async()=>{
    const {error}=await sb.from('apice_exercicios').delete().eq('id',id);if(error)throw error;
    S.exps=S.exps.filter(x=>x.id!==id);S.stack=[];closeSheet();render();toast('Exercício excluído')});
}
/* salvar ficha */
async function salvarFicha(comoModelo){
  const ed=S.ed,nome=(ed.nome||'').trim();
  if(!nome){msg('Dê um nome ao treino.');return}
  if(!ed.ex.length){msg('Adicione pelo menos um exercício.');return}
  for(const x of ed.ex){if(!String(x.reps||'').trim()){msg('Informe as repetições de '+exInfo(x.chave).nome+'.');return}}
  const exercicios=ed.ex.map(x=>({chave:x.chave,series:x.series,reps:String(x.reps).trim(),carga:String(x.carga||'').trim()||null,descanso:x.descanso||null,obs:String(x.obs||'').trim()||null}));
  const base={nome:nome.slice(0,40),foco:(ed.foco||'').trim().slice(0,60)||null,exercicios,obs:(ed.obs||'').trim().slice(0,500)||null};
  msg('');busy(comoModelo?'bt-ed2':'bt-ed',true,'Salvando…');
  try{
    let r;
    if(ed.id){r=await Q(sb.from('apice_fichas').update(base).eq('id',ed.id).select().single());const i=S.fichas.findIndex(x=>x.id===ed.id);if(i>=0)S.fichas[i]=r}
    else{r=await Q(sb.from('apice_fichas').insert(Object.assign({personal_id:S.user.id,aluno_id:ed.aluno_id,ordem:ed.aluno_id?ordemNova(ed.aluno_id):0},base)).select().single());S.fichas.push(r)}
    if(ed.aluno_id)avisar('apice_fichas',r.id,{novo:!ed.id});
    let extra='';
    if(comoModelo&&ed.aluno_id){const m=await Q(sb.from('apice_fichas').insert(Object.assign({personal_id:S.user.id,aluno_id:null,ordem:0},base)).select().single());S.fichas.push(m);extra=' e como modelo'}
    S.ed=null;closeSheet();render();toast('Treino salvo'+extra);
  }catch(e){busy(comoModelo?'bt-ed2':'bt-ed',false);msg(traduzErro(e))}
}
const ordemNova=alunoId=>{const l=fichasDe(alunoId);return l.length?Math.max(...l.map(f=>f.ordem||0))+1:0};
async function moverFicha(id,d){
  const f=S.fichas.find(x=>x.id===id);if(!f)return;
  const l=fichasDe(f.aluno_id),i=l.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=l.length)return;
  [l[i],l[j]]=[l[j],l[i]];
  try{for(let n=0;n<l.length;n++){if(l[n].ordem!==n){await Q(sb.from('apice_fichas').update({ordem:n}).eq('id',l[n].id));l[n].ordem=n}}}
  catch(e){toast(traduzErro(e))}
  rr();
}
function excluirFicha(id){
  const f=S.fichas.find(x=>x.id===id);if(!f)return;
  confirmar('Excluir treino?',f.aluno_id?`"${f.nome}" será removido do treino de ${nomeAluno(f.aluno_id)}.`:`O modelo "${f.nome}" será apagado. Treinos já copiados para alunos não mudam.`,'Sim, excluir',async()=>{
    const {error}=await sb.from('apice_fichas').delete().eq('id',id);if(error)throw error;
    S.fichas=S.fichas.filter(x=>x.id!==id);closeSheet();rr();toast('Treino excluído')});
}
/* cópias */
async function copiarFicha(src,alunoId,avisa){
  const row={personal_id:S.user.id,aluno_id:alunoId,nome:src.nome,foco:src.foco||null,ordem:alunoId?ordemNova(alunoId):0,exercicios:JSON.parse(JSON.stringify(exs(src))),obs:src.obs||null};
  const r=await Q(sb.from('apice_fichas').insert(row).select().single());S.fichas.push(r);
  if(alunoId&&avisa!==false)avisar('apice_fichas',r.id,{novo:true});
  return r;
}
function copiarDeSheet(alunoId){
  const mods=modelos(),outros=S.alunos.filter(a=>a.id!==alunoId&&fichasDe(a.id).length);
  const linha=(f,aid)=>`<div class="row" onclick="copiarDe('${esc(f.id)}','${esc(alunoId)}')"><div class="t"><b>${esc(f.nome)}</b><small>${esc(f.foco||'Sem foco')} · ${exs(f).length} exercícios</small></div><span style="color:var(--red);display:grid">${I.plus}</span></div>`;
  const sec=(tit,lista,extra)=>`<div class="lbl" style="margin:14px 0 6px"><span>${esc(tit)}</span>${extra||''}</div><div class="card" style="padding:0 14px;margin-bottom:0">${lista}</div>`;
  const corpo=(mods.length?sec('Modelos',mods.map(linha).join('')):'')+outros.map(a=>sec(a.nome,fichasDe(a.id).map(linha).join(''),`<a onclick="copiarTodas('${esc(a.id)}','${esc(alunoId)}')">Copiar todas</a>`)).join('');
  openSheet(`<h4>Copiar treino para ${primeiro(nomeAluno(alunoId))}</h4>${corpo||'<p style="font-size:14px;color:var(--mute);line-height:1.5;margin-bottom:12px">Você ainda não tem modelos nem treinos de outros alunos para copiar. Monte um treino e use Salvar também como modelo.</p>'}
  <button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">Fechar</button>`);
}
async function copiarDe(fid,alunoId){
  const f=S.fichas.find(x=>x.id===fid);if(!f)return;
  try{await copiarFicha(f,alunoId);closeSheet();render();toast('Treino copiado. Ajuste se precisar.')}catch(e){toast(traduzErro(e))}
}
async function copiarTodas(deId,alunoId){
  try{const l=fichasDe(deId);let ult=null;for(const f of l)ult=await copiarFicha(f,alunoId,false);if(ult)avisar('apice_fichas',ult.id,{novo:true});closeSheet();render();toast(l.length+(l.length===1?' treino copiado':' treinos copiados'))}catch(e){toast(traduzErro(e))}
}
function aplicarSheet(fid){
  const f=S.fichas.find(x=>x.id===fid);if(!f)return;
  const l=S.alunos.filter(a=>a.ativo!==false);
  openSheet(`<h4>Aplicar "${esc(f.nome)}" a…</h4>${l.length?`<div class="card" style="padding:0 14px;margin-bottom:12px">${l.map(a=>`<div class="row" onclick="aplicarModelo('${esc(fid)}','${esc(a.id)}')"><div class="av" style="width:36px;height:36px;font-size:12px">${esc(ini(a.nome))}</div><div class="t"><b>${esc(a.nome)}</b><small>${fichasDe(a.id).length?fichasDe(a.id).length+' treinos montados':'programa padrão'}</small></div><span style="color:var(--red);display:grid">${I.plus}</span></div>`).join('')}</div>`:'<p style="font-size:14px;color:var(--mute);margin-bottom:12px">Cadastre um aluno primeiro.</p>'}
  <button class="btn ghost" onclick="closeSheet()">Fechar</button>`);
}
async function aplicarModelo(fid,alunoId){
  const f=S.fichas.find(x=>x.id===fid);if(!f)return;
  try{await copiarFicha(f,alunoId);closeSheet();render();toast('Modelo aplicado a '+nomeAluno(alunoId))}catch(e){toast(traduzErro(e))}
}

iniciar();
</script>
</body>
</html>
